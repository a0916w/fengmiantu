<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用w封面工坊</title>
<style>
  /* 自托管封面字体（免费可商用） */
  @font-face {
    font-family: '沐瑶软笔手写体';
    src: url('/fonts/muyao-ruanbi.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: '沐瑶随心手写体';
    src: url('/fonts/muyao-suixin.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: '摄图摩登小方体';
    src: url('/fonts/modern-xiaofang.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: '包图小白体';
    src: url('/fonts/xiaobai.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: '千图小兔体';
    src: url('/fonts/xiaotu.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: '站酷快乐体';
    src: url('/fonts/kuaile.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: '新叶念体';
    src: url('/fonts/xinyenian.otf') format('opentype');
    font-display: swap;
  }
  @font-face {
    font-family: '字体视界法棍体';
    src: url('/fonts/fagun.ttf') format('truetype');
    font-display: swap;
  }

  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel-2: #1a1f2b;
    --border: #262c3a;
    --text: #e8ecf4;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --accent-2: #7c5bff;
    --ok: #3ecf8e;
    --err: #ff6b6b;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 14px 18px 20px;
  }
  .wrap { max-width: 1420px; margin: 0 auto; }

  .topbar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  h1 {
    font-size: 18px; font-weight: 700; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 8px;
  }
  h1 .logo {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .sub { color: var(--muted); font-size: 12px; }

  .main {
    display: grid; grid-template-columns: 1fr 480px; gap: 14px; align-items: start;
  }
  @media (max-width: 1100px) { .main { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }

  .input-row { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 16px; color: var(--text); font-size: 14px;
    outline: none; transition: border-color .15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input::placeholder { color: #5a6275; }

  button {
    border: none; border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 600; color: #fff;
    padding: 0 22px; transition: opacity .15s, transform .05s;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 8px 14px; font-weight: 500;
  }
  .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: #3a4255; }

  .hint { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .hint a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .status { margin-top: 6px; font-size: 12px; min-height: 16px; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .status.busy { color: var(--muted); }

  .frames { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  @media (max-width: 720px) { .frames { grid-template-columns: repeat(3, 1fr); } }
  .frame {
    background: var(--panel-2); border: 2px solid var(--border);
    border-radius: 10px; overflow: hidden; position: relative; cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .frame:hover { transform: translateY(-2px); }
  .frame.sel { border-color: var(--accent); }
  .frame .badge {
    position: absolute; top: 6px; left: 6px; z-index: 2;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.5);
  }
  .frame .ph {
    aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
    color: #4a5268; font-size: 12px;
    background: linear-gradient(100deg, var(--panel-2) 40%, #222838 50%, var(--panel-2) 60%);
    background-size: 200% 100%;
  }
  .frame.loading .ph { animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .frame img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
  .frame .bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px; font-size: 11px; color: var(--muted);
  }
  .frame .bar button { font-size: 11px; padding: 2px 8px; }

  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    margin: 12px 0 10px; flex-wrap: wrap; gap: 8px;
  }
  .section-title h2 { font-size: 14px; font-weight: 600; }
  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }

  .seg {
    display: inline-flex; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  .seg button {
    background: transparent; color: var(--muted); border-radius: 0;
    padding: 6px 10px; font-size: 12px; font-weight: 500;
  }
  .seg button.active { background: var(--accent); color: #fff; }

  /* 控制区：三行分组，所有控件统一 30px 高 */
  .ctl-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; align-items: center; }
  .ctl-row .seg { height: 30px; }
  .ctl-row .seg button { padding: 0 12px; height: 100%; }
  .btn-ghost.sm { height: 30px; padding: 0 12px; font-size: 12px; }
  .numctl {
    display: inline-flex; align-items: center; gap: 4px; height: 30px;
    font-size: 12px; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 0 10px;
  }
  .numctl input {
    width: 44px; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 12px; text-align: right;
  }
  .numctl select {
    background: var(--panel-2); border: none; outline: none;
    color: var(--text); font-size: 12px; cursor: pointer;
  }

  /* 字体选择：自定义下拉，每项用自身字体渲染预览 */
  .fontpick { position: relative; }
  .fontmenu {
    display: none; position: absolute; top: 34px; left: 0; z-index: 30;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    min-width: 230px; max-height: 320px; overflow-y: auto;
    box-shadow: 0 8px 28px rgba(0,0,0,.5); padding: 4px;
  }
  .fontmenu.open { display: block; }
  .fitem {
    padding: 7px 12px; border-radius: 7px; cursor: pointer;
    font-size: 17px; color: var(--text); white-space: nowrap;
  }
  .fitem:hover { background: #232a3a; }
  .fitem.active { background: var(--accent); }

  /* 颜色预设色块 */
  .swatch-label { font-size: 12px; color: var(--muted); }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 2px solid var(--border); padding: 0; display: inline-flex;
    align-items: center; justify-content: center; font-size: 10px; color: var(--muted);
    vertical-align: middle; margin: 0 2px;
  }
  .swatch.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  .order-strip {
    display: flex; gap: 8px; justify-content: center;
    margin-bottom: 8px; flex-wrap: wrap;
  }
  .oitem { width: 98px; cursor: pointer; }
  .oitem img, .oitem .ph2 {
    width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
    border-radius: 8px; border: 1px solid var(--border);
  }
  .oitem .ph2 {
    border-style: dashed; display: flex; align-items: center; justify-content: center;
    color: #4a5268; font-size: 20px;
  }
  .oitem.active img, .oitem.active .ph2 {
    border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent);
  }
  .oitem .cap {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; color: var(--muted); margin-top: 4px;
  }
  .oitem .cap button { padding: 1px 7px; font-size: 11px; }

  #result-box { text-align: center; }
  #result-wrap {
    position: relative; display: inline-block; width: 100%; max-width: 420px;
    font-size: 0; /* 消除 inline 间隙 */
  }
  #result {
    display: none; width: 100%;
    border-radius: 10px; border: 1px solid var(--border);
    cursor: grab; touch-action: none;
  }
  #overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  #result-empty { color: #4a5268; font-size: 13px; padding: 40px 0; }
  .pv-cap { display: none; color: var(--muted); font-size: 11px; margin: 10px 0 6px; }
  .phone {
    display: none; width: 100%; max-width: 300px; margin: 0 auto;
    background: #0f1118; border: 1px solid var(--border); border-radius: 14px;
    padding: 8px;
    grid-template-columns: 1fr 1fr; gap: 8px 6px;
  }
  .tile { text-align: left; }
  .tile img {
    width: 100%; display: block; aspect-ratio: 16/9;
    border-radius: 8px; background: #1a1f2b;
  }
  .tile .tl { height: 9px; background: #232a3a; border-radius: 4px; margin-top: 8px; }
  .tile .tl.short { width: 55%; margin-top: 6px; }
  .phone.portrait .tile img { aspect-ratio: 3/4; } /* 直版封面的手机双列 */
  .dl-row { margin-top: 12px; display: none; }
  .dl-row button { padding: 9px 24px; }
  .dl-note { color: var(--muted); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1><span class="logo">🎬</span>使用w封面工坊</h1>
    <span class="sub">粘贴 m3u8 链接 · 智能选帧 · 三张拼成一张封面</span>
    <a href="/report" onclick="event.preventDefault();var t=prompt('请输入报表访问口令',localStorage.getItem('fm_report_token')||'');if(t){localStorage.setItem('fm_report_token',t);window.open('/report?token='+encodeURIComponent(t),'_blank');}" style="margin-left:auto;font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--border);padding:5px 11px;border-radius:8px">📊 使用报表</a>
  </div>

  <!-- 自由裁剪弹窗 -->
  <div id="crop-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;align-items:center;justify-content:center">
    <div class="card" style="max-width:760px;width:94%">
      <div class="section-title" style="margin-top:0">
        <h2>自由裁剪 <span style="color:var(--muted);font-size:12px;font-weight:400">在图上框选要保留的区域</span></h2>
      </div>
      <canvas id="crop-canvas" style="width:100%;border-radius:8px;cursor:crosshair;touch-action:none"></canvas>
      <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
        <button class="btn-ghost" id="crop-reset">重置为全图</button>
        <button class="btn-ghost" id="crop-cancel">取消</button>
        <button class="btn-primary" id="crop-ok" style="padding:8px 22px">应用</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="card">
      <div class="ctl-row" style="margin-bottom:10px">
        <div class="seg" id="uimode" title="新做封面: m3u8 抽帧拼图 / 原有封面盖logo: 用原图只叠 logo">
          <button data-u="cover" class="active">新做封面</button>
          <button data-u="logo">原有封面盖logo</button>
        </div>
      </div>
      <div class="input-row" id="row-cover">
        <input type="text" id="url" placeholder="https://example.com/video/index.m3u8" spellcheck="false"
               value="https://back_only.ffkm25.com/common/msdl//dd140d5457926a329f7198bf2__1183554/hls/1/index.m3u8">
        <button class="btn-primary" id="go" style="padding:11px 22px">生成封面</button>
      </div>
      <div class="input-row" id="row-logo" style="display:none">
        <button class="btn-primary" id="upload-original" style="padding:11px 22px">📁 上传原封面</button>
        <input type="file" id="original-file" accept="image/*" style="display:none">
        <span class="status" style="margin:0;align-self:center">上传或从来源带入原封面，可缩放/拖动后只叠 logo</span>
      </div>
      <div class="status" id="status">智能选帧会自动避开黑屏和转场画面</div>
      <div class="section-title" id="frames-title">
        <h2>候选帧 <span style="color:var(--muted);font-size:12px;font-weight:400">点击选帧，按布局用 1–4 张</span></h2>
        <button class="btn-ghost" id="reroll-all" disabled>🎲 全部换一批</button>
      </div>
      <div class="frames" id="frames"></div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">
        <h2>拼接结果 <span id="out-size" style="color:var(--muted);font-size:12px;font-weight:400">640×360 JPG</span></h2>
        <div class="dl-row" id="dl-row" style="margin:0">
          <button class="btn-primary" id="download-sm" style="padding:7px 16px;font-size:13px">⬇ 下载封面图</button>
          <button class="btn-primary" id="use-cover" disabled style="padding:7px 16px;font-size:13px;display:none;background:var(--accent2,#22c55e)">✓ 用作封面</button>
        </div>
      </div>
      <div class="ctl-row">
        <div class="seg" id="layout">
          <button data-l="diag" class="active">斜切</button>
          <button data-l="single">单图</button>
        </div>
        <div class="seg" id="orient" title="横版 640×360 / 直版 540×720">
          <button data-o="h" class="active">横版</button>
          <button data-o="v">直版</button>
        </div>
        <label class="numctl" title="选择印在封面左上角的 logo">Logo
          <select id="logo-select">
            <option value="">无 Logo</option>
          </select>
        </label>
        <label class="numctl" title="Logo 大小：占封面宽度的比例，100% = 默认（部分 logo 默认更小）">Logo大小
          <input type="number" id="logo-scale" min="30" max="200" step="5" value="100"><span>%</span>
        </label>
      </div>
      <div class="ctl-row" id="row-frameadj">
        <label class="numctl" title="高清锐利化强度：0 关闭，0.8 适中，2 最强">锐化
          <input type="number" id="sharpen-amt" min="0" max="2" step="0.1" value="0.8">
        </label>
        <label class="numctl" title="裁掉每帧顶部的百分比，去顶部水印">裁顶
          <input type="number" id="crop-top" min="0" max="20" step="0.5" value="12"><span>%</span>
        </label>
        <label class="numctl" title="裁掉每帧底部的百分比，去底部字幕/水印">裁底
          <input type="number" id="crop-bottom" min="0" max="20" step="0.5" value="0"><span>%</span>
        </label>
        <button class="btn-ghost sm" id="crop-undo">撤销裁剪</button>
      </div>
      <div class="ctl-row" id="row-mosaic" style="margin-bottom:10px">
        <div class="seg" id="mode" title="取景：拖动/滚轮调整画面；马赛克：在图上框选打码">
          <button data-m="pan" class="active">取景</button>
          <button data-m="mosaic">马赛克</button>
        </div>
        <div class="seg" id="mosaic-style" title="马赛克样式：打蒙=模糊更自然，颗粒=像素块">
          <button data-s="blur" class="active">打蒙</button>
          <button data-s="pixel">颗粒</button>
        </div>
        <button class="btn-ghost sm" id="mosaic-undo">撤销马赛克</button>
      </div>
      <div class="ctl-row">
        <input type="text" id="title-input" placeholder="文字字段(可选)，输入后在预览图上拖动摆位" maxlength="40"
          style="height:30px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);color:inherit;padding:0 10px;font-size:12px;flex:1;min-width:140px">
        <div class="fontpick" id="font-pick">
          <button class="btn-ghost sm" id="font-btn">黑体 ▾</button>
          <div class="fontmenu" id="font-menu"></div>
        </div>
        <label class="numctl" title="字号，占画面高度的百分比">字号
          <select id="text-size">
            <option value="8">小 8%</option>
            <option value="11">中 11%</option>
            <option value="13" selected>大 13%</option>
            <option value="17">特大 17%</option>
            <option value="22">巨大 22%</option>
          </select>
        </label>
        <button class="btn-ghost sm" id="text-del" title="删除当前选中的字段">删字段</button>
      </div>
      <div class="ctl-row" style="margin-bottom:10px">
        <span class="swatch-label">字色</span>
        <span id="fill-swatches"></span>
        <span class="swatch-label" style="margin-left:8px">描边</span>
        <span id="stroke-swatches"></span>
      </div>
      <div class="order-strip" id="order-strip"></div>
      <div id="result-box">
        <div id="result-empty">选满 3 张候选帧后自动拼接预览</div>
        <div class="pv-cap" id="cap-full" style="margin-top:0">整张预览 · 取景：拖动/滚轮缩放 · 文字：点选后拖动/拉角缩放/转柄旋转/✕删除 · 马赛克：框选打码</div>
        <div id="result-wrap">
          <canvas id="result"></canvas>
          <canvas id="overlay"></canvas>
        </div>
        <div class="pv-cap" id="cap-phone">手机双列效果</div>
        <div class="phone" id="phone">
          <div class="tile"><img class="pv"><div class="tl"></div><div class="tl short"></div></div>
          <div class="tile"><img class="pv"><div class="tl"></div><div class="tl short"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const COUNT = 20;      // 候选帧数量
const CONCURRENCY = 6; // 同时截帧的并发数
// 每种布局需要的帧数
const LAYOUT_NEED = { diag: 3, single: 1 };
const $ = (id) => document.getElementById(id);
const state = {
  url: '',
  duration: null,
  frames: new Array(COUNT).fill(null), // {time, img: HTMLImageElement}
  slots: [null, null, null],           // 卡槽：每格存候选帧下标，数量随布局变化
  offsets: [],                         // 每格取景偏移 {fx, fy, z}，拖动/滚轮调整
  crops: [],                           // 每格自由裁剪 {x,y,w,h}（0~1 比例，默认全图）
  sharpenAmt: 0.8,                     // 整图锐化强度（0 关闭 ~ 2 最强）
  orient: 'h',                         // 封面方向：h 横版 640×360 / v 直版 540×720
  texts: [],                           // 文字字段 [{text, sizePct, style, fx, fy}]，位置在预览上拖
  activeText: -1,                      // 当前选中的字段下标
  mode: 'pan',                         // 预览交互模式：pan 取景 / mosaic 马赛克
  mosaicStyle: 'blur',                 // 马赛克样式：blur 打蒙 / pixel 颗粒
  mosaics: [],                         // 马赛克区域 [{x,y,w,h}]，画布坐标
  activeSlot: null,                    // 当前高亮的目标卡槽
  layout: 'diag',
  logoName: '',      // 选中的 logo 名，空 = 不印
  logoScale: 1,      // logo 大小倍数（1 = 默认比例；可在页面调整，部分 logo 有更小的默认值）

  cropTop: 0.12,     // 顶部裁剪，占帧高的比例（默认 12%，多裁去顶部台标/水印）
  cropBottom: 0,     // 底部裁剪，占帧高的比例
  running: false,
};

// 左上角 Logo 水印：全部预载进缓存，切换零等待
// 界面模式：cover=新做封面(m3u8抽帧拼图) / logo=原有封面盖logo(原图当底图只叠logo)
let uiMode = 'cover';
const origState = { img: null, off: { fx: 0.5, fy: 0.5, z: 1 } };

const logoCache = {}; // name -> { img, ready }

function preloadLogo(name) {
  if (!name || logoCache[name]) return;
  const e = (logoCache[name] = { img: new Image(), ready: false });
  e.img.onload = () => {
    e.ready = true;
    if (state.logoName === name) composeFinal(); // 恰好选中它则立即合成
  };
  e.img.src = '/logo-img/' + encodeURIComponent(name);
}

// 各 logo 的默认大小倍数（没列到的默认 1）。vodvip 默认更小。
const LOGO_DEFAULT_SCALE = { vodvip: 0.65 };
// 切到某 logo 时套用它的默认大小，并同步「Logo大小」输入框。
function applyLogoDefaultScale(name) {
  state.logoScale = LOGO_DEFAULT_SCALE[name] != null ? LOGO_DEFAULT_SCALE[name] : 1;
  const inp = $('logo-scale');
  if (inp) inp.value = Math.round(state.logoScale * 100);
}
// 手动调整 Logo 大小
$('logo-scale').oninput = () => {
  const pct = Number($('logo-scale').value) || 100;
  state.logoScale = Math.min(2, Math.max(0.3, pct / 100));
  composeFinal();
};

// 拉取 logo 列表填充下拉框并全部预载。
// 默认选择优先级：URL ?logo=<名字>（命中库里的名字）> mm > 列表第一个
fetch('/api/logo-list')
  .then((r) => r.json())
  .then(({ logos }) => {
    const sel = $('logo-select');
    (logos || []).forEach((n) => {
      const o = document.createElement('option');
      o.value = n;
      o.textContent = n;
      sel.appendChild(o);
      preloadLogo(n);
    });
    const want = new URLSearchParams(location.search).get('logo');
    const list = logos || [];
    const def = list.includes(want) ? want : list.includes('mm') ? 'mm' : list[0] || '';
    sel.value = def;
    state.logoName = def;
    applyLogoDefaultScale(def); // 套用该 logo 的默认大小
    if (/^yini/i.test(def)) setOrient('v'); // yini 系 logo 默认直版
    if (baseValid) composeFinal();
  })
  .catch(() => {});

function setStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = 'status ' + (cls || '');
}

const layoutNeed = () => LAYOUT_NEED[state.layout] || 3;

/** 卡槽数量跟随当前布局 */
function ensureSlots() {
  const n = layoutNeed();
  while (state.slots.length < n) state.slots.push(null);
  state.slots.length = n;
  while (state.offsets.length < n) state.offsets.push({ fx: 0.5, fy: 0.5, z: 1 });
  state.offsets.length = n;
  while (state.crops.length < n) state.crops.push({ x: 0, y: 0, w: 1, h: 1 });
  state.crops.length = n;
  if (state.activeSlot != null && state.activeSlot >= n) state.activeSlot = null;
}

const firstEmptySlot = () => {
  const k = state.slots.indexOf(null);
  return k < 0 ? null : k;
};

function renderFrameCards() {
  ensureSlots();
  const box = $('frames');
  box.innerHTML = '';
  for (let i = 0; i < COUNT; i++) {
    const f = state.frames[i];
    const order = state.slots.indexOf(i);
    const div = document.createElement('div');
    div.className =
      'frame' + (f === 'loading' ? ' loading' : '') + (order >= 0 ? ' sel' : '');
    if (f && f !== 'loading') {
      div.innerHTML = `
        ${order >= 0 ? `<div class="badge">${order + 1}</div>` : ''}
        <img src="${f.img.src}">
        <div class="bar">
          <span>${fmtTime(f.time)}</span>
          <button class="btn-ghost" onclick="event.stopPropagation();reroll(${i})">换一帧</button>
        </div>`;
      div.onclick = () => pickFrame(i);
    } else {
      div.innerHTML = `<div class="ph">${f === 'loading' ? '截取中' : '#' + (i + 1)}</div>`;
    }
    box.appendChild(div);
  }
  renderSlots();
}

/** 卡槽条：点卡槽指定目标位，点候选帧填入；可用 ←/→ 互换 */
function renderSlots() {
  const box = $('order-strip');
  box.innerHTML = '';
  state.slots.forEach((fi, pos) => {
    const f = fi != null ? state.frames[fi] : null;
    const filled = f && f !== 'loading';
    const d = document.createElement('div');
    d.className = 'oitem' + (state.activeSlot === pos ? ' active' : '') + (filled ? '' : ' empty');
    if (filled) {
      const c = state.crops[pos];
      const cropped = c && (c.x > 0 || c.y > 0 || c.w < 1 || c.h < 1);
      d.innerHTML = `
        <img src="${f.img.src}">
        <div class="cap">
          <button class="btn-ghost" ${pos === 0 ? 'disabled' : ''} onclick="event.stopPropagation();moveSel(${pos},-1)">←</button>
          <span>${pos + 1}号</span>
          <button class="btn-ghost" title="自由裁剪" ${cropped ? 'style="color:var(--accent);border-color:var(--accent)"' : ''} onclick="event.stopPropagation();openCrop(${pos})">✂</button>
          <button class="btn-ghost" ${pos === state.slots.length - 1 ? 'disabled' : ''} onclick="event.stopPropagation();moveSel(${pos},1)">→</button>
        </div>`;
    } else {
      d.innerHTML = `
        <div class="ph2">＋</div>
        <div class="cap"><span style="margin:0 auto">${pos + 1}号 · 待填入</span></div>`;
    }
    d.onclick = () => {
      state.activeSlot = state.activeSlot === pos ? null : pos;
      renderFrameCards();
    };
    box.appendChild(d);
  });
}

function moveSel(pos, dir) {
  const j = pos + dir;
  if (j < 0 || j >= state.slots.length) return;
  [state.slots[pos], state.slots[j]] = [state.slots[j], state.slots[pos]];
  [state.crops[pos], state.crops[j]] = [state.crops[j], state.crops[pos]]; // 裁剪跟着图走
  state.offsets[pos] = { fx: 0.5, fy: 0.5, z: 1 };
  state.offsets[j] = { fx: 0.5, fy: 0.5, z: 1 };
  renderFrameCards();
  stitch();
}
window.moveSel = moveSel;

/** 点候选帧：已在槽里则移除；否则填入高亮槽/第一个空槽，全满则替换最后一格 */
function pickFrame(i) {
  const f = state.frames[i];
  if (!f || f === 'loading') return;
  const cur = state.slots.indexOf(i);
  if (cur >= 0) {
    state.slots[cur] = null;
    state.offsets[cur] = { fx: 0.5, fy: 0.5, z: 1 };
    state.crops[cur] = { x: 0, y: 0, w: 1, h: 1 };
    state.activeSlot = cur;
  } else {
    let t = state.activeSlot != null ? state.activeSlot : firstEmptySlot();
    if (t == null) t = state.slots.length - 1;
    state.slots[t] = i;
    state.offsets[t] = { fx: 0.5, fy: 0.5, z: 1 };
    state.crops[t] = { x: 0, y: 0, w: 1, h: 1 };
    state.activeSlot = firstEmptySlot();
  }
  renderFrameCards();
  stitch();
}
window.pickFrame = pickFrame;

function fmtTime(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

async function api(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || '请求失败');
  return data;
}

function loadImg(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

async function fetchFrame(i) {
  state.frames[i] = 'loading';
  renderFrameCards();
  const data = await api('/api/frame', {
    url: state.url, duration: state.duration, index: i, count: COUNT,
  });
  const img = await loadImg(data.image);
  state.frames[i] = { time: data.time, img };
  renderFrameCards();
  stitch();
}

/** 限并发地截取全部候选帧，返回失败数 */
async function fetchAll() {
  let next = 0, done = 0, failed = 0;
  const worker = async () => {
    while (next < COUNT) {
      const i = next++;
      try {
        await fetchFrame(i);
      } catch {
        state.frames[i] = null;
        failed++;
        renderFrameCards();
      }
      done++;
      setStatus(`智能选帧中… ${done}/${COUNT}`, 'busy');
    }
  };
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  return failed;
}

async function generate() {
  const url = $('url').value.trim();
  if (!url) { setStatus('请先输入 m3u8 链接', 'err'); return; }
  state.url = url;
  state.running = true;
  state.frames = new Array(COUNT).fill(null);
  state.slots = Array.from({ length: layoutNeed() }, (_, k) => k); // 默认按顺序填前几张
  state.offsets = state.slots.map(() => ({ fx: 0.5, fy: 0.5, z: 1 }));
  state.crops = state.slots.map(() => ({ x: 0, y: 0, w: 1, h: 1 }));
  state.mosaics = [];
  cropHistory = [];
  baseValid = false;
  state.activeSlot = null;
  renderFrameCards();
  $('go').disabled = true;
  $('reroll-all').disabled = true;

  try {
    setStatus('正在解析视频信息…', 'busy');
    const probe = await api('/api/probe', { url });
    state.duration = probe.duration;
    const failed = await fetchAll();
    if (failed === COUNT) throw new Error('全部截帧失败，请检查链接');
    setStatus(
      failed ? `完成，但有 ${failed} 帧失败，可单独重试` : '✓ 已截取 ' + COUNT + ' 张候选帧',
      failed ? 'err' : 'ok'
    );
  } catch (e) {
    setStatus('✕ ' + e.message, 'err');
    renderFrameCards();
  } finally {
    state.running = false;
    $('go').disabled = false;
    $('reroll-all').disabled = false;
  }
}

async function reroll(i) {
  if (state.running || !state.url) return;
  try {
    await fetchFrame(i);
  } catch (e) {
    state.frames[i] = null;
    renderFrameCards();
    setStatus('✕ 第 ' + (i + 1) + ' 帧截取失败：' + e.message, 'err');
  }
}
window.reroll = reroll;

$('reroll-all').onclick = async () => {
  if (state.running || !state.url) return;
  state.running = true;
  $('go').disabled = true;
  $('reroll-all').disabled = true;
  try {
    const failed = await fetchAll();
    setStatus(failed ? `完成，但有 ${failed} 帧失败` : '✓ 已更换全部候选帧', failed ? 'err' : 'ok');
  } finally {
    state.running = false;
    $('go').disabled = false;
    $('reroll-all').disabled = false;
  }
};

// ---------- Canvas 拼接 ----------
// 横版：1280×720 合成 → 导出 640×360；直版：1080×1440 合成 → 导出 540×720
const DIMS = {
  h: { W: 1280, H: 720, exW: 640, exH: 360 },
  v: { W: 1080, H: 1440, exW: 540, exH: 720 },
};
const dims = () => DIMS[state.orient];

// 底图缓存：画面 + 锐化 + 马赛克（不含 logo）。换 logo 时直接用缓存合成，毫秒级。
const baseCanvas = document.createElement('canvas');
let baseValid = false;

function stitch(light) {
  ensureSlots();
  const picked = state.slots.map((fi) => (fi != null ? state.frames[fi] : null));
  const missing = picked.filter((f) => !f || f === 'loading').length;
  if (missing > 0) {
    if (state.frames.some((f) => f && f !== 'loading')) {
      setStatus(`还差 ${missing} 张：点击候选帧填入空位`, 'busy');
    }
    return;
  }
  const { W, H } = dims();
  baseCanvas.width = W;
  baseCanvas.height = H;
  const ctx = baseCanvas.getContext('2d');
  paintBg(ctx, baseCanvas);

  const cells = layoutCells(W, H);
  lastCells = cells;
  cells.forEach((cell, i) => {
    const img = picked[i].img;
    const off = state.offsets[i] || { fx: 0.5, fy: 0.5, z: 1 };
    const crop = state.crops[i];
    if (cell.poly) {
      ctx.save();
      ctx.beginPath();
      cell.poly.forEach(([x, y], j) => (j ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.closePath();
      ctx.clip();
      drawCover(ctx, img, cell.x, cell.y, cell.w, cell.h, off, crop);
      ctx.restore();
    } else {
      drawCover(ctx, img, cell.x, cell.y, cell.w, cell.h, off, crop);
    }
  });

  if (state.layout === 'diag') drawSeams(ctx, W, H); // 斜切接缝白条

  if (state.sharpenAmt > 0 && !light) sharpenCanvas(ctx, baseCanvas, 3, state.sharpenAmt * 1.1); // 锐化在打码和 logo 之前

  applyMosaics(ctx, baseCanvas);
  baseValid = true;
  composeFinal(light);
}

/** 底图 + logo 合成到预览画布；换 logo 只需调这个，不必重拼底图 */
function composeFinal(light) {
  if (!baseValid) return;
  const canvas = $('result');
  const ctx = canvas.getContext('2d');
  canvas.width = baseCanvas.width;
  canvas.height = baseCanvas.height;
  ctx.drawImage(baseCanvas, 0, 0);

  // 左上角盖 Logo：不加底板，用多层黑色投影把 logo 从画面里衬出来
  const le = state.logoName && logoCache[state.logoName];
  if (le && le.ready) {
    // 直版画布窄，logo 占宽比例放大一档才够醒目
    const lw = Math.round(canvas.width * (state.orient === 'v' ? 0.42 : 0.31) * (state.logoScale || 1));
    const lh = Math.round(lw * le.img.naturalHeight / le.img.naturalWidth);
    const m = Math.round(canvas.width * 0.019);
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
    ctx.shadowBlur = 18;
    ctx.drawImage(le.img, m, m, lw, lh); // 画两遍加深阴影轮廓
    ctx.drawImage(le.img, m, m, lw, lh);
    ctx.restore();
  }

  drawTexts(ctx, canvas); // 文字字段（空则跳过）
  drawOverlay();          // 选中框画在独立覆盖层，不会进导出图

  if (light) return; // 拖动过程中只重绘画布，跳过下面的重活

  // 手机双列预览在 updateDownloads 里用 640 成品图更新（所见即所得）
  $('result-empty').style.display = 'none';
  canvas.style.display = 'block';
  $('cap-full').style.display = 'block';
  $('cap-phone').style.display = 'block';
  $('phone').style.display = 'grid';
  $('dl-row').style.display = 'block';
  updateDownloads();
}

function paintBg(ctx, canvas) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ---------- 原有封面盖 logo 模式 ----------
// 底图 = 原图本身（保持原尺寸）；复用取景拖动/滚轮缩放（origState.off）+ logo/文字/发布。
function buildOriginalBase(light) {
  const img = origState.img;
  if (!img || !img.naturalWidth) return;
  baseCanvas.width = img.naturalWidth;
  baseCanvas.height = img.naturalHeight;
  const ctx = baseCanvas.getContext('2d');
  paintBg(ctx, baseCanvas);
  drawCover(ctx, img, 0, 0, baseCanvas.width, baseCanvas.height, origState.off);
  baseValid = true;
  composeFinal(light);
}

// 载入原封面（本地上传的 objectURL 或来源带来的 http 链接）。远程链接需该主机允许
// CORS，否则导出画布会被污染；本地上传无此限制。
function loadOriginal(src, opts) {
  const img = new Image();
  // 远程链接走同域代理（/api/proxy-image），绕过 canvas 跨域污染；本地上传(objectURL)直接用。
  const realSrc = (opts && opts.remote) ? ('/api/proxy-image?url=' + encodeURIComponent(src)) : src;
  img.onload = () => {
    origState.img = img;
    origState.off = { fx: 0.5, fy: 0.5, z: 1 };
    // switchMode:false → 只把原图载入备用，不切换到盖logo模式（从其它页带 cover 过来时用：
    // 默认还是「新作封面」从 m3u8 抽帧，操作员想用原图再手动切「原有封面盖logo」即可）。
    if (opts && opts.switchMode === false) return;
    setUiMode('logo');
    setStatus('原封面已载入：滚轮缩放 / 拖动取景，选 logo 后可下载或用作封面', 'ok');
    buildOriginalBase();
  };
  img.onerror = () => setStatus('原封面加载失败（链接失效或代理拉取失败）', 'err');
  img.src = realSrc;
}

function setUiMode(mode) {
  uiMode = mode === 'logo' ? 'logo' : 'cover';
  const isLogo = uiMode === 'logo';
  [...$('uimode').children].forEach((b) => b.classList.toggle('active', b.dataset.u === uiMode));
  $('row-cover').style.display = isLogo ? 'none' : '';
  $('row-logo').style.display = isLogo ? '' : 'none';
  // 帧相关的控件在盖logo模式下无意义，隐藏（保留 logo / 文字 / 下载）。
  ['frames-title', 'frames', 'layout', 'orient', 'row-frameadj', 'row-mosaic', 'order-strip'].forEach((id) => {
    const el = $(id); if (el) el.style.display = isLogo ? 'none' : '';
  });
  if (isLogo && origState.img) buildOriginalBase();
}

/**
 * 文字字段：canvas 叠字，导出随整图缩小。每个字段有内容/字号/样式/位置（可拖）。
 * 绘制时记录每个字段的包围盒（画布坐标），供预览上点选与拖动。
 */
/** 覆盖层：画选中文字的变换框（虚线框 + 缩放/旋转/删除手柄），独立于导出画布 */
function drawOverlay() {
  const ov = $('overlay');
  ov.width = $('result').width;
  ov.height = $('result').height;
  const b = state.activeText >= 0 ? textBoxes.find((x) => x.i === state.activeText) : null;
  if (!b || state.mode === 'mosaic') return;
  const rect = $('result').getBoundingClientRect();
  if (!rect.width) return;
  const k = ov.width / rect.width; // 1 css px = k 画布 px，保证手柄屏显大小恒定
  const g = ov.getContext('2d');
  g.save();
  g.translate(b.cx, b.cy);
  g.rotate(b.rot);
  g.strokeStyle = '#5b8cff';
  g.lineWidth = 1.6 * k;
  g.setLineDash([7 * k, 5 * k]);
  g.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
  g.setLineDash([]);
  // 旋转手柄连线
  g.beginPath();
  g.moveTo(0, -b.h / 2);
  g.lineTo(0, -b.h / 2 - 26 * k);
  g.stroke();
  const dot = (x, y, fill) => {
    g.beginPath();
    g.arc(x, y, 7 * k, 0, Math.PI * 2);
    g.fillStyle = fill;
    g.fill();
    g.strokeStyle = '#fff';
    g.lineWidth = 1.6 * k;
    g.stroke();
  };
  dot(b.w / 2, b.h / 2, '#5b8cff');            // 右下：缩放
  dot(0, -b.h / 2 - 26 * k, '#5b8cff');        // 顶部：旋转
  dot(b.w / 2, -b.h / 2, '#e63946');           // 右上：删除
  // 删除手柄上画 ×
  g.strokeStyle = '#fff';
  g.lineWidth = 2 * k;
  const r2 = 3.2 * k, hx = b.w / 2, hy = -b.h / 2;
  g.beginPath();
  g.moveTo(hx - r2, hy - r2); g.lineTo(hx + r2, hy + r2);
  g.moveTo(hx + r2, hy - r2); g.lineTo(hx - r2, hy + r2);
  g.stroke();
  g.restore();
}

let textBoxes = []; // [{i, cx, cy, w, h, rot}]
const DEFAULT_FONT = '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
function drawTexts(ctx, canvas) {
  textBoxes = [];
  const W = canvas.width, H = canvas.height;
  state.texts.forEach((t, i) => {
    const text = (t.text || '').trim();
    if (!text) return;
    const fontOf = (s) => `700 ${s}px ${t.font || DEFAULT_FONT}`;
    let size = Math.round((t.sizePct || 0.13) * H);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = fontOf(size);
    while (ctx.measureText(text).width > W * 0.94 && size > 12) { size -= 2; ctx.font = fontOf(size); }
    const tw = ctx.measureText(text).width;
    const cx = t.fx * W, cy = t.fy * H;
    ctx.translate(cx, cy);
    ctx.rotate(t.rot || 0);
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = size * 0.28;
    if (t.stroke) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(3, size * 0.14);
      ctx.strokeStyle = t.stroke;
      ctx.strokeText(text, 0, 0);
    }
    ctx.shadowBlur = t.stroke ? 0 : size * 0.28; // 无描边时靠投影衬托
    ctx.fillStyle = t.color || '#ffffff';
    ctx.fillText(text, 0, 0);
    ctx.restore();
    const pad = size * 0.4;
    textBoxes.push({ i, cx, cy, w: tw + pad * 2, h: size + pad * 2, rot: t.rot || 0 });
  });
}

/**
 * 高清锐利化：反锐化掩模 sharpened = orig + amount × (orig − blur(radius))。
 * radius 要按画布分辨率选：1280 画布用 3px（缩小显示后仍可见），640 导出用 1px。
 */
function sharpenCanvas(ctx, canvas, radius = 3, amount = 0.7) {
  const w = canvas.width, h = canvas.height;
  mosaicTmp.width = w; mosaicTmp.height = h;
  const t = mosaicTmp.getContext('2d');
  t.filter = `blur(${radius}px)`;
  t.drawImage(canvas, 0, 0);
  t.filter = 'none';
  const orig = ctx.getImageData(0, 0, w, h);
  const blur = t.getImageData(0, 0, w, h);
  const o = orig.data, b = blur.data;
  for (let i = 0; i < o.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      const v = o[i + c] + amount * (o[i + c] - b[i + c]);
      o[i + c] = v < 0 ? 0 : v > 255 ? 255 : v;
    }
  }
  ctx.putImageData(orig, 0, 0);
}

// ---------- 马赛克 ----------
const mosaicTmp = document.createElement('canvas');

const MOSAIC_GROW = 14; // 实际打码范围比框选外扩的像素（1280 画布）

function applyMosaics(ctx, canvas) {
  state.mosaics.forEach((r) => {
    // 外扩一圈再钳制到画布内，保证框到哪就盖到哪（包括画面边缘）
    let x = Math.round(r.x - MOSAIC_GROW), y = Math.round(r.y - MOSAIC_GROW);
    let w = Math.round(r.w + MOSAIC_GROW * 2), h = Math.round(r.h + MOSAIC_GROW * 2);
    if (x < 0) { w += x; x = 0; }
    if (y < 0) { h += y; y = 0; }
    w = Math.min(canvas.width - x, w);
    h = Math.min(canvas.height - y, h);
    if (w < 4 || h < 4) return;
    if ((r.style || 'blur') === 'pixel') pixelate(ctx, canvas, x, y, w, h);
    else blurPatch(ctx, canvas, x, y, w, h);
  });
}

/** 颗粒：经典像素块化 */
function pixelate(ctx, canvas, x, y, w, h) {
  const BLOCK = 18;
  const bw = Math.max(1, Math.round(w / BLOCK));
  const bh = Math.max(1, Math.round(h / BLOCK));
  mosaicTmp.width = bw; mosaicTmp.height = bh;
  const t = mosaicTmp.getContext('2d');
  t.imageSmoothingEnabled = true;
  t.drawImage(canvas, x, y, w, h, 0, 0, bw, bh);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mosaicTmp, 0, 0, bw, bh, x, y, w, h);
  ctx.imageSmoothingEnabled = true;
}

/**
 * 打蒙：磨砂玻璃式模糊（下采样再平滑放大）。
 * 整个区域 100% 覆盖——包括框选边缘和画面边框，不留羽化空隙。
 */
function blurPatch(ctx, canvas, x, y, w, h) {
  const f = Math.max(10, Math.round(Math.min(w, h) / 10)); // 缩小倍数 ≈ 模糊强度
  const bw = Math.max(1, Math.round(w / f));
  const bh = Math.max(1, Math.round(h / f));
  mosaicTmp.width = bw; mosaicTmp.height = bh;
  const t = mosaicTmp.getContext('2d');
  t.imageSmoothingEnabled = true;
  t.drawImage(canvas, x, y, w, h, 0, 0, bw, bh);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(mosaicTmp, 0, 0, bw, bh, x, y, w, h);
}

/**
 * 斜切接缝效果：层叠投影——前一块面板沿斜缝在下一块上投下柔和阴影，
 * 看起来像三张画面叠放，有立体纵深感，没有生硬的分隔线。
 */
function drawSeams(ctx, W, H) {
  const cells = layoutCells(W, H);
  const tracePoly = (poly) => {
    ctx.beginPath();
    poly.forEach(([x, y], j) => (j ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
  };
  for (let i = 1; i < cells.length; i++) {
    if (!cells[i].poly || !cells[i - 1].poly) continue;
    ctx.save();
    tracePoly(cells[i].poly); // 只允许影子落在"下面"那块里
    ctx.clip();
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = Math.round(W * 0.025);
    if (state.orient === 'v') ctx.shadowOffsetY = Math.round(W * 0.012);
    else ctx.shadowOffsetX = Math.round(W * 0.012);
    tracePoly(cells[i - 1].poly); // 填充体被 clip 掉，只留投影
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.restore();
  }
}

/** 当前布局的单元格列表，下标与卡槽一一对应；斜切布局带裁剪多边形 */
function layoutCells(W, H) {
  if (state.layout === 'single') return [{ x: 0, y: 0, w: W, h: H }];
  if (state.orient === 'v') {
    // 直版斜切三联：三条横向斜切带（竖条会把 16:9 的帧裁得太狠）
    const s = 40, b1 = H / 3, b2 = (H / 3) * 2;
    const polys = [
      [[0, 0], [W, 0], [W, b1 - s], [0, b1 + s]],
      [[0, b1 + s], [W, b1 - s], [W, b2 - s], [0, b2 + s]],
      [[0, b2 + s], [W, b2 - s], [W, H], [0, H]],
    ];
    return polys.map((poly) => {
      const ys = poly.map((p) => p[1]);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      return { x: 0, y: minY, w: W, h: maxY - minY, poly };
    });
  }
  // 横版斜切三联：平行竖向斜线分割
  const s = 56, b1 = W / 3, b2 = (W / 3) * 2;
  const polys = [
    [[0, 0], [b1 + s, 0], [b1 - s, H], [0, H]],
    [[b1 + s, 0], [b2 + s, 0], [b2 - s, H], [b1 - s, H]],
    [[b2 + s, 0], [W, 0], [W, H], [b2 - s, H]],
  ];
  return polys.map((poly) => {
    const xs = poly.map((p) => p[0]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    return { x: minX, y: 0, w: maxX - minX, h: H, poly };
  });
}

/**
 * 检测帧的内容区（去掉四周近黑边框，如竖屏视频 pillarbox 的左右黑条），返回 {x,y,w,h}(0~1)。
 * 结果缓存在 img 上；跨域污染读不到像素、或裁掉过多(误检/整幅偏暗)时退回整图。
 * 这样直版斜切等「宽扁格子」cover 填充时不会再把源帧自带的黑条一起留下 → 消除黑框。
 */
function contentRect(img) {
  if (img.__contentRect) return img.__contentRect;
  const full = { x: 0, y: 0, w: 1, h: 1 };
  const W = img.naturalWidth, H = img.naturalHeight;
  if (!W || !H) return full; // 未加载完，先别缓存
  const scale = Math.min(1, 200 / Math.max(W, H));
  const w = Math.max(1, Math.round(W * scale)), h = Math.max(1, Math.round(H * scale));
  const cnv = document.createElement('canvas');
  cnv.width = w; cnv.height = h;
  const c = cnv.getContext('2d', { willReadFrequently: true });
  c.drawImage(img, 0, 0, w, h);
  let data;
  try { data = c.getImageData(0, 0, w, h).data; }
  catch (e) { return (img.__contentRect = full); } // 跨域污染，放弃检测
  const TH = 24; // 近黑阈值
  const colHas = (x) => { for (let y = 0; y < h; y++) { const i = (y * w + x) * 4; if (data[i] > TH || data[i + 1] > TH || data[i + 2] > TH) return true; } return false; };
  const rowHas = (y) => { for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; if (data[i] > TH || data[i + 1] > TH || data[i + 2] > TH) return true; } return false; };
  let x0 = 0, x1 = w - 1, y0 = 0, y1 = h - 1;
  while (x0 < x1 && !colHas(x0)) x0++;
  while (x1 > x0 && !colHas(x1)) x1--;
  while (y0 < y1 && !rowHas(y0)) y0++;
  while (y1 > y0 && !rowHas(y1)) y1--;
  const rect = { x: x0 / w, y: y0 / h, w: (x1 - x0 + 1) / w, h: (y1 - y0 + 1) / h };
  if (rect.w < 0.4 || rect.h < 0.4) return (img.__contentRect = full); // 安全阀：裁太多不裁
  return (img.__contentRect = rect);
}

/**
 * 等比缩放裁剪填满目标区域（object-fit: cover）。
 * 先自动去掉源帧四周黑边，再按比例掐掉源图顶部（去原视频水印），再在剩余区域内取景；
 * off.fx / off.fy（0~1，0.5 居中）控制取景窗位置，可拖动调整；
 * off.z（≥1，默认 1）为缩放倍数，越大取景窗越小 = 画面越放大。
 */
function coverWindow(img, dw, dh, off, crop) {
  const W0 = img.naturalWidth, H0 = img.naturalHeight;
  // 用户裁剪（默认整图）先与「去黑边内容区」求交，作为实际可用区域
  const base = crop || { x: 0, y: 0, w: 1, h: 1 };
  const cr = contentRect(img);
  const cx = Math.max(base.x, cr.x), cy = Math.max(base.y, cr.y);
  const c = {
    x: cx,
    y: cy,
    w: Math.max(0.05, Math.min(base.x + base.w, cr.x + cr.w) - cx),
    h: Math.max(0.05, Math.min(base.y + base.h, cr.y + cr.h) - cy),
  };
  const left = c.x * W0;
  const availW = Math.max(16, c.w * W0);
  // 上下边界：全局裁顶/裁底和自由裁剪各取更深的那个（再多裁 2px 去顶部残留细条）
  const top = Math.max(Math.min(state.cropTop, 0.2) * H0, c.y * H0) + 2;
  const bottom = Math.min((1 - Math.min(state.cropBottom, 0.2)) * H0, (c.y + c.h) * H0);
  const availH = Math.max(16, bottom - top);
  const dRatio = dw / dh;
  let sw = availW, sh = availH;
  if (availW / availH > dRatio) sw = sh * dRatio;
  else sh = sw / dRatio;
  const z = Math.max(1, off.z || 1);
  sw /= z; sh /= z;
  return {
    sw, sh,
    sx: left + (availW - sw) * off.fx,
    sy: top + (availH - sh) * off.fy,
    slackX: availW - sw,
    slackY: availH - sh,
  };
}

function drawCover(ctx, img, x, y, dw, dh, off = { fx: 0.5, fy: 0.5, z: 1 }, crop) {
  const w = coverWindow(img, dw, dh, off, crop);
  ctx.drawImage(img, w.sx, w.sy, w.sw, w.sh, x, y, dw, dh);
}

// ---------- 拖动调整取景 ----------
let lastCells = [];
let drag = null;
const clamp01 = (v) => Math.min(1, Math.max(0, v));

function pointInPoly(p, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (yi > p.y !== yj > p.y && p.x < ((xj - xi) * (p.y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function cellIndexAt(p) {
  for (let i = 0; i < lastCells.length; i++) {
    const c = lastCells[i];
    const hit = c.poly
      ? pointInPoly(p, c.poly)
      : p.x >= c.x && p.x < c.x + c.w && p.y >= c.y && p.y < c.y + c.h;
    if (hit) return i;
  }
  return -1;
}

const resultCanvas = $('result');

function canvasPoint(e) {
  const rect = resultCanvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (resultCanvas.width / rect.width),
    y: (e.clientY - rect.top) * (resultCanvas.height / rect.height),
  };
}

let mosaicDraft = null; // 正在框选的马赛克区域

let dragText = null;   // 移动文字 {i, x0, y0, fx0, fy0}
let resizeText = null; // 缩放文字 {i, d0, size0}
let rotateText = null; // 旋转文字 {i, a0, rot0}

/** 选中字段的包围盒（画布坐标） */
const activeBox = () =>
  state.activeText >= 0 ? textBoxes.find((b) => b.i === state.activeText) : null;

/** 把画布点变换到某个盒子的局部坐标（未旋转空间） */
function toLocal(p, b) {
  const dx = p.x - b.cx, dy = p.y - b.cy;
  const c = Math.cos(-b.rot), s = Math.sin(-b.rot);
  return { x: dx * c - dy * s, y: dx * s + dy * c };
}

/** 命中选中框的手柄：resize(右下) / rotate(顶部) / delete(右上) */
function handleHitAt(p) {
  const b = activeBox();
  if (!b) return null;
  const rect = resultCanvas.getBoundingClientRect();
  const k = resultCanvas.width / rect.width; // 1 css px = k 画布 px
  const r = 14 * k; // 手柄命中半径
  const l = toLocal(p, b);
  const near = (x, y) => Math.hypot(l.x - x, l.y - y) <= r;
  if (near(b.w / 2, -b.h / 2)) return 'delete';
  if (near(b.w / 2, b.h / 2)) return 'resize';
  if (near(0, -b.h / 2 - 26 * k)) return 'rotate';
  return null;
}

function textHitAt(p) {
  for (let k = textBoxes.length - 1; k >= 0; k--) {
    const b = textBoxes[k];
    const l = toLocal(p, b);
    if (Math.abs(l.x) <= b.w / 2 && Math.abs(l.y) <= b.h / 2) return b.i;
  }
  return -1;
}

resultCanvas.addEventListener('pointerdown', (e) => {
  if (state.mode === 'mosaic') {
    const p = canvasPoint(e);
    mosaicDraft = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    resultCanvas.setPointerCapture(e.pointerId);
    e.preventDefault();
    return;
  }
  const p = canvasPoint(e);
  // 1) 选中框的手柄
  const handle = handleHitAt(p);
  if (handle) {
    const idx = state.activeText;
    const t = state.texts[idx];
    const b = activeBox();
    if (handle === 'delete') {
      state.texts.splice(idx, 1);
      state.activeText = -1;
      syncTextControls();
      composeFinal();
      return;
    }
    if (handle === 'resize') {
      resizeText = { i: idx, d0: Math.max(8, Math.hypot(p.x - b.cx, p.y - b.cy)), size0: t.sizePct };
    } else {
      rotateText = { i: idx, a0: Math.atan2(p.y - b.cy, p.x - b.cx), rot0: t.rot || 0 };
    }
    resultCanvas.setPointerCapture(e.pointerId);
    e.preventDefault();
    return;
  }
  // 2) 文字本体：点选 + 拖动摆位
  const hit = textHitAt(p);
  if (hit >= 0) {
    state.activeText = hit;
    syncTextControls();
    const t = state.texts[hit];
    dragText = { i: hit, x0: e.clientX, y0: e.clientY, fx0: t.fx, fy0: t.fy };
    resultCanvas.setPointerCapture(e.pointerId);
    resultCanvas.style.cursor = 'move';
    composeFinal(true);
    e.preventDefault();
    return;
  }
  // 3) 点空处：取消文字选中，进入取景拖动
  if (state.activeText >= 0) {
    state.activeText = -1;
    syncTextControls();
    composeFinal(true);
  }
  // 盖logo模式：整张原图当一个取景层，空处拖动改 origState.off
  if (uiMode === 'logo') {
    if (!origState.img) return;
    drag = { orig: true, x0: e.clientX, y0: e.clientY, fx0: origState.off.fx, fy0: origState.off.fy };
    resultCanvas.setPointerCapture(e.pointerId);
    resultCanvas.style.cursor = 'grabbing';
    e.preventDefault();
    return;
  }
  const i = cellIndexAt(p);
  if (i < 0) return;
  const f = state.slots[i] != null ? state.frames[state.slots[i]] : null;
  if (!f || f === 'loading') return;
  const off = state.offsets[i] || (state.offsets[i] = { fx: 0.5, fy: 0.5, z: 1 });
  drag = { i, x0: e.clientX, y0: e.clientY, fx0: off.fx, fy0: off.fy };
  resultCanvas.setPointerCapture(e.pointerId);
  resultCanvas.style.cursor = 'grabbing';
  e.preventDefault();
});

const draftRect = () => ({
  x: Math.min(mosaicDraft.x0, mosaicDraft.x1),
  y: Math.min(mosaicDraft.y0, mosaicDraft.y1),
  w: Math.abs(mosaicDraft.x1 - mosaicDraft.x0),
  h: Math.abs(mosaicDraft.y1 - mosaicDraft.y0),
});

resultCanvas.addEventListener('pointermove', (e) => {
  if (dragText) {
    const t = state.texts[dragText.i];
    const rect = resultCanvas.getBoundingClientRect();
    t.fx = Math.min(1, Math.max(0, dragText.fx0 + (e.clientX - dragText.x0) / rect.width));
    t.fy = Math.min(1, Math.max(0, dragText.fy0 + (e.clientY - dragText.y0) / rect.height));
    composeFinal(true);
    return;
  }
  if (resizeText) {
    const t = state.texts[resizeText.i];
    const p = canvasPoint(e);
    const d = Math.hypot(p.x - t.fx * resultCanvas.width, p.y - t.fy * resultCanvas.height);
    t.sizePct = Math.min(0.45, Math.max(0.04, resizeText.size0 * (d / resizeText.d0)));
    composeFinal(true);
    return;
  }
  if (rotateText) {
    const t = state.texts[rotateText.i];
    const p = canvasPoint(e);
    const a = Math.atan2(p.y - t.fy * resultCanvas.height, p.x - t.fx * resultCanvas.width);
    let rot = rotateText.rot0 + a - rotateText.a0;
    // 靠近水平/±90° 时自动吸附
    const snap = [0, Math.PI / 2, -Math.PI / 2, Math.PI, -Math.PI];
    for (const s of snap) if (Math.abs(rot - s) < 0.06) { rot = s; break; }
    t.rot = rot;
    composeFinal(true);
    return;
  }
  if (mosaicDraft) {
    const p = canvasPoint(e);
    mosaicDraft.x1 = p.x;
    mosaicDraft.y1 = p.y;
    stitch(true);
    // 画框选虚线
    const ctx = resultCanvas.getContext('2d');
    const r = draftRect();
    ctx.save();
    ctx.strokeStyle = '#5b8cff';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 6]);
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.restore();
    return;
  }
  if (!drag) return;
  if (drag.orig) {
    const img = origState.img, off = origState.off;
    const W = baseCanvas.width, H = baseCanvas.height;
    const w = coverWindow(img, W, H, off);
    const rect = resultCanvas.getBoundingClientRect();
    const cssToCanvas = resultCanvas.width / rect.width;
    const canvasToSrc = w.sw / W;
    const dxSrc = (e.clientX - drag.x0) * cssToCanvas * canvasToSrc;
    const dySrc = (e.clientY - drag.y0) * cssToCanvas * canvasToSrc;
    if (w.slackX > 1) off.fx = clamp01(drag.fx0 - dxSrc / w.slackX);
    if (w.slackY > 1) off.fy = clamp01(drag.fy0 - dySrc / w.slackY);
    buildOriginalBase(true);
    return;
  }
  const cell = lastCells[drag.i];
  const img = state.frames[state.slots[drag.i]].img;
  const off = state.offsets[drag.i];
  const w = coverWindow(img, cell.w, cell.h, off, state.crops[drag.i]);
  // 屏幕位移 → 画布位移 → 源图位移 → 取景窗位置增量（拖动方向与取景窗移动方向相反）
  const rect = resultCanvas.getBoundingClientRect();
  const cssToCanvas = resultCanvas.width / rect.width;
  const canvasToSrc = w.sw / cell.w;
  const dxSrc = (e.clientX - drag.x0) * cssToCanvas * canvasToSrc;
  const dySrc = (e.clientY - drag.y0) * cssToCanvas * canvasToSrc;
  if (w.slackX > 1) off.fx = clamp01(drag.fx0 - dxSrc / w.slackX);
  if (w.slackY > 1) off.fy = clamp01(drag.fy0 - dySrc / w.slackY);
  stitch(true);
});

const endDrag = () => {
  if (dragText || resizeText || rotateText) {
    dragText = resizeText = rotateText = null;
    resultCanvas.style.cursor = state.mode === 'mosaic' ? 'crosshair' : 'grab';
    composeFinal();
    return;
  }
  if (mosaicDraft) {
    const r = draftRect();
    if (r.w > 12 && r.h > 12) state.mosaics.push({ ...r, style: state.mosaicStyle }); // 过小的框视为误触
    mosaicDraft = null;
    stitch();
    return;
  }
  if (!drag) return;
  const wasOrig = drag.orig;
  drag = null;
  resultCanvas.style.cursor = 'grab';
  if (wasOrig) buildOriginalBase(); // 松手后完整更新手机预览和下载体积
  else stitch();
};
resultCanvas.addEventListener('pointerup', endDrag);
resultCanvas.addEventListener('pointercancel', endDrag);

// ---------- 自由裁剪弹窗 ----------
let cropEdit = null; // {pos, img, rect(0~1 比例), start}
const cropCv = $('crop-canvas');

function openCrop(pos) {
  const fi = state.slots[pos];
  const f = fi != null ? state.frames[fi] : null;
  if (!f || f === 'loading') return;
  cropEdit = { pos, img: f.img, rect: { ...state.crops[pos] }, start: null };
  cropCv.width = f.img.naturalWidth;
  cropCv.height = f.img.naturalHeight;
  $('crop-modal').style.display = 'flex';
  drawCropEditor();
}
window.openCrop = openCrop;

function drawCropEditor() {
  const cx = cropCv.getContext('2d');
  cx.drawImage(cropEdit.img, 0, 0);
  const r = cropEdit.rect;
  const X = r.x * cropCv.width, Y = r.y * cropCv.height;
  const Wc = r.w * cropCv.width, Hc = r.h * cropCv.height;
  cx.save();
  cx.fillStyle = 'rgba(0,0,0,.55)'; // 压暗保留区以外的部分
  cx.fillRect(0, 0, cropCv.width, Y);
  cx.fillRect(0, Y + Hc, cropCv.width, cropCv.height - Y - Hc);
  cx.fillRect(0, Y, X, Hc);
  cx.fillRect(X + Wc, Y, cropCv.width - X - Wc, Hc);
  cx.strokeStyle = '#5b8cff';
  cx.lineWidth = Math.max(2, cropCv.width / 320);
  cx.setLineDash([14, 8]);
  cx.strokeRect(X, Y, Wc, Hc);
  cx.restore();
}

function cropPoint(e) {
  const rect = cropCv.getBoundingClientRect();
  return {
    x: Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)),
    y: Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height)),
  };
}

cropCv.addEventListener('pointerdown', (e) => {
  if (!cropEdit) return;
  cropEdit.start = cropPoint(e);
  cropCv.setPointerCapture(e.pointerId);
  e.preventDefault();
});
cropCv.addEventListener('pointermove', (e) => {
  if (!cropEdit || !cropEdit.start) return;
  const p = cropPoint(e), s = cropEdit.start;
  cropEdit.rect = {
    x: Math.min(s.x, p.x),
    y: Math.min(s.y, p.y),
    w: Math.abs(p.x - s.x),
    h: Math.abs(p.y - s.y),
  };
  drawCropEditor();
});
const endCropDrag = () => {
  if (!cropEdit || !cropEdit.start) return;
  cropEdit.start = null;
  // 框太小视为误触，恢复全图
  if (cropEdit.rect.w < 0.05 || cropEdit.rect.h < 0.05) {
    cropEdit.rect = { x: 0, y: 0, w: 1, h: 1 };
    drawCropEditor();
  }
};
cropCv.addEventListener('pointerup', endCropDrag);
cropCv.addEventListener('pointercancel', endCropDrag);

$('crop-reset').onclick = () => {
  if (!cropEdit) return;
  cropEdit.rect = { x: 0, y: 0, w: 1, h: 1 };
  drawCropEditor();
};
$('crop-cancel').onclick = () => {
  cropEdit = null;
  $('crop-modal').style.display = 'none';
};
$('crop-ok').onclick = () => {
  if (!cropEdit) return;
  cropHistory.push({ pos: cropEdit.pos, prev: { ...state.crops[cropEdit.pos] } }); // 记录撤销点
  state.crops[cropEdit.pos] = { ...cropEdit.rect };
  state.offsets[cropEdit.pos] = { fx: 0.5, fy: 0.5, z: 1 }; // 裁剪变了，取景回到居中
  cropEdit = null;
  $('crop-modal').style.display = 'none';
  renderFrameCards();
  stitch();
};

// 撤销裁剪：一步步回退每次「应用」
let cropHistory = [];
$('crop-undo').onclick = () => {
  const last = cropHistory.pop();
  if (!last) return;
  state.crops[last.pos] = last.prev;
  state.offsets[last.pos] = { fx: 0.5, fy: 0.5, z: 1 };
  renderFrameCards();
  stitch();
};

// 模式切换：取景 / 马赛克
$('mode').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.mode = btn.dataset.m;
  [...$('mode').children].forEach((b) => b.classList.toggle('active', b === btn));
  resultCanvas.style.cursor = state.mode === 'mosaic' ? 'crosshair' : 'grab';
  drawOverlay(); // 马赛克模式下隐藏文字选中框
};

$('sharpen-amt').oninput = () => {
  state.sharpenAmt = Math.min(2, Math.max(0, Number($('sharpen-amt').value) || 0));
  stitch();
};

$('mosaic-style').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.mosaicStyle = btn.dataset.s;
  [...$('mosaic-style').children].forEach((b) => b.classList.toggle('active', b === btn));
};

$('mosaic-undo').onclick = () => {
  if (!state.mosaics.length) return;
  state.mosaics.pop();
  stitch();
};

// 滚轮缩放：悬停在哪一格就缩放哪一格（放大 = 裁得更紧）
let wheelTimer = null;
resultCanvas.addEventListener('wheel', (e) => {
  if (uiMode === 'logo') {
    if (!origState.img) return;
    e.preventDefault();
    const off = origState.off;
    off.z = Math.min(4, Math.max(1, (off.z || 1) * (e.deltaY < 0 ? 1.08 : 1 / 1.08)));
    buildOriginalBase(true);
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => buildOriginalBase(), 250);
    return;
  }
  if (state.mode === 'mosaic') return;
  const i = cellIndexAt(canvasPoint(e));
  if (i < 0) return;
  const f = state.slots[i] != null ? state.frames[state.slots[i]] : null;
  if (!f || f === 'loading') return;
  e.preventDefault();
  const off = state.offsets[i] || (state.offsets[i] = { fx: 0.5, fy: 0.5, z: 1 });
  off.z = Math.min(4, Math.max(1, (off.z || 1) * (e.deltaY < 0 ? 1.08 : 1 / 1.08)));
  stitch(true);
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => stitch(), 250); // 停止滚动后完整更新
}, { passive: false });

$('layout').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.layout = btn.dataset.l;
  $('layout').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
  renderFrameCards(); // 卡槽数量随布局变化
  stitch();
};
// ---------- 文字字段控件 ----------
const FONTS = [
  { name: '黑体', css: DEFAULT_FONT },
  { name: '沐瑶软笔', css: '"沐瑶软笔手写体","PingFang SC",sans-serif' },
  { name: '沐瑶随心', css: '"沐瑶随心手写体","PingFang SC",sans-serif' },
  { name: '摩登小方', css: '"摄图摩登小方体","PingFang SC",sans-serif' },
  { name: '小白体', css: '"包图小白体","PingFang SC",sans-serif' },
  { name: '小兔体', css: '"千图小兔体","PingFang SC",sans-serif' },
  { name: '快乐体', css: '"站酷快乐体","PingFang SC",sans-serif' },
  { name: '新叶念', css: '"新叶念体","PingFang SC",sans-serif' },
  { name: '法棍体', css: '"字体视界法棍体","PingFang SC",sans-serif' },
];
const FILL_COLORS = ['#ffffff', '#ffe14d', '#ff4d6d', '#ff85c2', '#4dd2ff', '#111111'];
const STROKE_COLORS = ['#000000', '#ffffff', '#e63946', '#1d4ed8', '']; // '' = 无描边
const textDefaults = { sizePct: 0.13, font: DEFAULT_FONT, color: '#ffffff', stroke: '#000000', rot: 0 };

function activeField() {
  return state.activeText >= 0 ? state.texts[state.activeText] : null;
}

const fontName = (css) => (FONTS.find((f) => f.css === css) || FONTS[0]).name;

/** 控件回显当前选中字段的参数 */
function syncTextControls() {
  const t = activeField();
  $('title-input').value = t ? t.text : '';
  $('text-size').value = String(Math.round(((t ? t.sizePct : textDefaults.sizePct) * 100)));
  const font = t ? (t.font || DEFAULT_FONT) : textDefaults.font;
  $('font-btn').textContent = fontName(font) + ' ▾';
  $('font-btn').style.fontFamily = font;
  [...$('font-menu').children].forEach((el) => el.classList.toggle('active', el.dataset.css === font));
  const color = t ? t.color : textDefaults.color;
  const stroke = t ? (t.stroke || '') : textDefaults.stroke;
  [...$('fill-swatches').children].forEach((el) => el.classList.toggle('active', el.dataset.c === color));
  [...$('stroke-swatches').children].forEach((el) => el.classList.toggle('active', el.dataset.c === stroke));
}

/** 修改选中字段（无则新建）并重画；webfont 未就绪时加载完自动补画 */
function patchField(patch) {
  let t = activeField();
  if (!t) {
    t = { text: '', ...textDefaults, fx: 0.5, fy: 0.88 };
    state.texts.push(t);
    state.activeText = state.texts.length - 1;
  }
  Object.assign(t, patch);
  composeFinal();
  document.fonts.load(`700 60px ${t.font}`, t.text || '测').then(() => composeFinal()).catch(() => {});
}

$('title-input').oninput = (e) => patchField({ text: e.target.value });
$('text-size').onchange = () => {
  const v = (Number($('text-size').value) || 13) / 100;
  textDefaults.sizePct = v;
  if (activeField()) patchField({ sizePct: v });
};
$('text-del').onclick = () => {
  if (state.activeText < 0) return;
  state.texts.splice(state.activeText, 1);
  state.activeText = state.texts.length - 1;
  syncTextControls();
  composeFinal();
};

// 字体下拉：每项用自身字体渲染预览
FONTS.forEach((f) => {
  const el = document.createElement('div');
  el.className = 'fitem';
  el.dataset.css = f.css;
  el.style.fontFamily = f.css;
  el.textContent = `${f.name} · 可爱标题123`;
  el.onclick = () => {
    textDefaults.font = f.css;
    $('font-menu').classList.remove('open');
    if (activeField()) patchField({ font: f.css });
    syncTextControls();
  };
  $('font-menu').appendChild(el);
});
$('font-btn').onclick = (e) => {
  e.stopPropagation();
  $('font-menu').classList.toggle('open');
};
document.addEventListener('click', (e) => {
  if (!e.target.closest('.fontpick')) $('font-menu').classList.remove('open');
});

// 颜色预设色块
function buildSwatches(box, colors, apply) {
  colors.forEach((c) => {
    const el = document.createElement('button');
    el.className = 'swatch';
    el.dataset.c = c;
    if (c) el.style.background = c;
    else el.textContent = '无';
    el.title = c || '无描边';
    el.onclick = () => { apply(c); syncTextControls(); };
    box.appendChild(el);
  });
}
buildSwatches($('fill-swatches'), FILL_COLORS, (c) => {
  textDefaults.color = c;
  if (activeField()) patchField({ color: c });
});
buildSwatches($('stroke-swatches'), STROKE_COLORS, (c) => {
  textDefaults.stroke = c;
  if (activeField()) patchField({ stroke: c });
});
syncTextControls();

// ---------- 横版 / 直版 ----------
function setOrient(o) {
  if (state.orient === o) return;
  state.orient = o;
  [...$('orient').children].forEach((b) => b.classList.toggle('active', b.dataset.o === o));
  $('result-wrap').style.maxWidth = o === 'v' ? '260px' : '420px';
  $('phone').classList.toggle('portrait', o === 'v');
  const d = dims();
  $('out-size').textContent = `${d.exW}×${d.exH} JPG`;
  stitch(); // 画布尺寸变了，底图需要重建
}
$('orient').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  setOrient(btn.dataset.o);
};

$('logo-select').onchange = () => {
  state.logoName = $('logo-select').value;
  applyLogoDefaultScale(state.logoName); // 套用该 logo 的默认大小
  preloadLogo(state.logoName); // 一般已在缓存，未载完时 onload 会补一次合成
  setOrient(/^yini/i.test(state.logoName) ? 'v' : 'h'); // yini 系 logo 默认直版
  composeFinal();              // 直接用底图缓存合成，毫秒级
};
$('crop-top').oninput = () => {
  state.cropTop = Math.min(20, Math.max(0, Number($('crop-top').value) || 0)) / 100;
  stitch();
};
$('crop-bottom').oninput = () => {
  state.cropBottom = Math.min(20, Math.max(0, Number($('crop-bottom').value) || 0)) / 100;
  stitch();
};

// ---------- 导出：640×360 JPG 压缩（在 1280 画布上合成后超采样缩小） ----------
let smallBlob = null, exportSeq = 0;

const toBlobAsync = (cv, type, q) => new Promise((r) => cv.toBlob(r, type, q));
const kb = (n) => (n / 1024).toFixed(0) + 'KB';

// 导出尺寸：盖logo模式 = 原图尺寸（保持不变），新做封面 = 固定 640×360 / 540×720。
function exportSize() {
  if (uiMode === 'logo') { const r = $('result'); return { exW: r.width, exH: r.height }; }
  const d = dims();
  return { exW: d.exW, exH: d.exH };
}

async function updateDownloads() {
  const seq = ++exportSeq;
  const { exW, exH } = exportSize();
  const small = document.createElement('canvas');
  small.width = exW; small.height = exH;
  const sctx = small.getContext('2d');
  sctx.drawImage($('result'), 0, 0, exW, exH);
  // 盖logo模式保持原图不动、不锐化；新做封面才在输出分辨率上做主力锐化。
  if (uiMode !== 'logo' && state.sharpenAmt > 0) sharpenCanvas(sctx, small, 1, state.sharpenAmt);
  const sm = await toBlobAsync(small, 'image/jpeg', 0.8);
  // 手机双列预览直接用成品图（所见即所得）
  const smallUrl = small.toDataURL('image/jpeg', 0.9);
  document.querySelectorAll('.pv').forEach((img) => (img.src = smallUrl));
  if (seq !== exportSeq) return; // 期间又重新拼接了，丢弃本次结果
  smallBlob = sm;
  $('out-size').textContent = `${exW}×${exH} JPG`;
  $('download-sm').textContent = `⬇ 下载封面图 · ${kb(sm.size)}`;
  const uc = $('use-cover');
  if (uc && uc.style.display !== 'none') { uc.disabled = false; uc.textContent = '✓ 用作封面'; }
}

$('download-sm').onclick = () => {
  if (!smallBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(smallBlob);
  a.download = `cover-${exportSize().exW}x${exportSize().exH}-${Date.now()}.jpg`;
  a.click();
  URL.revokeObjectURL(a.href);
};

$('uimode').onclick = (e) => {
  const b = e.target.closest('button');
  if (b) setUiMode(b.dataset.u);
};
$('upload-original').onclick = () => $('original-file').click();
$('original-file').onchange = (e) => {
  const file = e.target.files && e.target.files[0];
  if (file) loadOriginal(URL.createObjectURL(file));
  e.target.value = '';
};

$('go').onclick = generate;
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });

renderFrameCards();

// ---------- 后台「手动选封面」对接 ----------
// URL 参数：?m3u8=&external_id=&sign=&callback=（callback 已含 ?sign=，回写时原样 POST）。
const PICK = new URLSearchParams(location.search);
const PICK_EXTERNAL = PICK.get('external_id');
const PICK_CALLBACK = PICK.get('callback');

const blobToDataUrl = (b) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = rej;
  r.readAsDataURL(b);
});

$('use-cover').onclick = async () => {
  if (!PICK_EXTERNAL || !PICK_CALLBACK) return alert('缺少回调参数，无法回写');
  if (!smallBlob) return alert('请先生成封面');
  const btn = $('use-cover');
  btn.disabled = true; btn.textContent = '上传中…';
  try {
    const image = await blobToDataUrl(smallBlob);
    // logo 路由优先用 URL 的 ?logo=（项目跳来时带的，是路由到哪个站的权威来源），
    // 其次才用当前选中的 logo；避免 logo 库没加载到时 state.logoName 为空导致回调白名单退回全局。
    const routeLogo = PICK.get('logo') || state.logoName || '';
    const r = await fetch('/api/publish', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image, external_id: PICK_EXTERNAL, callback: PICK_CALLBACK, logo: routeLogo, mode: uiMode }),
    });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || j.detail || '上传失败');
    btn.textContent = '✓ 已更新封面';
    alert('封面已更新，可关闭本页返回后台');
  } catch (e) {
    btn.disabled = false; btn.textContent = '✓ 用作封面';
    alert(e.message);
  }
};

// 从后台跳来：自动填 m3u8、亮出「用作封面」、自动生成。
// 支持从 URL 预填：?title=标题文字 &color=#ff0000（字色）&font=沐瑶软笔（字体名，见 FONTS）
// &logo=名字（logo 由上方 logo-list 逻辑处理）。三者都可选，缺省用默认。
(function initFromQuery() {
  const m3u8 = PICK.get('m3u8');
  if (m3u8) $('url').value = m3u8;

  // 来源带原封面过来：?cover=<url> → 自动进「原有封面盖logo」模式并载入原图。
  // 从其它页带 cover 过来：只把原图载入备用（不切模式），默认仍是「新作封面」从 m3u8 抽帧。
  const cover = PICK.get('cover');
  if (cover) loadOriginal(cover, { remote: true, switchMode: false });

  // 预填标题 / 字色 / 字体（可只传其中一个；有 title 才会新建文字字段）。
  const qTitle = PICK.get('title');
  const qColor = PICK.get('color');
  const qFont = PICK.get('font');
  if (qTitle && qTitle.trim() !== '') {
    const patch = { text: qTitle };
    if (qColor) {
      const c = qColor[0] === '#' ? qColor : '#' + qColor;
      if (/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(c)) patch.color = c;
    }
    if (qFont) {
      const f = FONTS.find((x) => x.name === qFont || x.css === qFont);
      if (f) patch.font = f.css;
    }
    $('title-input').value = qTitle;
    patchField(patch);
    if (typeof syncTextControls === 'function') syncTextControls();
  }

  if (PICK_EXTERNAL && PICK_CALLBACK) {
    const b = $('use-cover');
    b.style.display = '';
    // 带了原封面就走盖logo模式，不自动抽帧生成；否则老流程自动生成。
    if (m3u8 && typeof generate === 'function') generate(); // 即使带了 cover 也默认从 m3u8 自动生成新封面
  }
})();

</script>
</body>
</html>
