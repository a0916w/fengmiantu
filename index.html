<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能封面图</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel-2: #1a1f2b;
    --border: #262c3a;
    --text: #e8ecf4;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --accent-2: #7c5bff;
    --ok: #3ecf8e;
    --err: #ff6b6b;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 14px 18px 20px;
  }
  .wrap { max-width: 1420px; margin: 0 auto; }

  .topbar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  h1 {
    font-size: 18px; font-weight: 700; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 8px;
  }
  h1 .logo {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .sub { color: var(--muted); font-size: 12px; }

  .main {
    display: grid; grid-template-columns: 1fr 480px; gap: 14px; align-items: start;
  }
  @media (max-width: 1100px) { .main { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }

  .input-row { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 16px; color: var(--text); font-size: 14px;
    outline: none; transition: border-color .15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input::placeholder { color: #5a6275; }

  button {
    border: none; border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 600; color: #fff;
    padding: 0 22px; transition: opacity .15s, transform .05s;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 8px 14px; font-weight: 500;
  }
  .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: #3a4255; }

  .hint { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .hint a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .status { margin-top: 6px; font-size: 12px; min-height: 16px; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .status.busy { color: var(--muted); }

  .frames { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  @media (max-width: 720px) { .frames { grid-template-columns: repeat(3, 1fr); } }
  .frame {
    background: var(--panel-2); border: 2px solid var(--border);
    border-radius: 10px; overflow: hidden; position: relative; cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .frame:hover { transform: translateY(-2px); }
  .frame.sel { border-color: var(--accent); }
  .frame .badge {
    position: absolute; top: 6px; left: 6px; z-index: 2;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.5);
  }
  .frame .ph {
    aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
    color: #4a5268; font-size: 12px;
    background: linear-gradient(100deg, var(--panel-2) 40%, #222838 50%, var(--panel-2) 60%);
    background-size: 200% 100%;
  }
  .frame.loading .ph { animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .frame img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
  .frame .bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px; font-size: 11px; color: var(--muted);
  }
  .frame .bar button { font-size: 11px; padding: 2px 8px; }

  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    margin: 12px 0 10px; flex-wrap: wrap; gap: 8px;
  }
  .section-title h2 { font-size: 14px; font-weight: 600; }
  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }

  .seg {
    display: inline-flex; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  .seg button {
    background: transparent; color: var(--muted); border-radius: 0;
    padding: 6px 10px; font-size: 12px; font-weight: 500;
  }
  .seg button.active { background: var(--accent); color: #fff; }

  .order-strip {
    display: flex; gap: 8px; justify-content: center;
    margin-bottom: 8px; flex-wrap: wrap;
  }
  .oitem { width: 98px; cursor: pointer; }
  .oitem img, .oitem .ph2 {
    width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
    border-radius: 8px; border: 1px solid var(--border);
  }
  .oitem .ph2 {
    border-style: dashed; display: flex; align-items: center; justify-content: center;
    color: #4a5268; font-size: 20px;
  }
  .oitem.active img, .oitem.active .ph2 {
    border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent);
  }
  .oitem .cap {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; color: var(--muted); margin-top: 4px;
  }
  .oitem .cap button { padding: 1px 7px; font-size: 11px; }

  #result-box { text-align: center; }
  #result {
    display: none; max-width: 420px; width: 100%; margin: 0 auto;
    border-radius: 10px; border: 1px solid var(--border);
    cursor: grab; touch-action: none;
  }
  #result-empty { color: #4a5268; font-size: 13px; padding: 40px 0; }
  .pv-cap { display: none; color: var(--muted); font-size: 11px; margin: 10px 0 6px; }
  .phone {
    display: none; width: 100%; max-width: 300px; margin: 0 auto;
    background: #0f1118; border: 1px solid var(--border); border-radius: 14px;
    padding: 8px;
    grid-template-columns: 1fr 1fr; gap: 8px 6px;
  }
  .tile { text-align: left; }
  .tile img {
    width: 100%; display: block; aspect-ratio: 16/9;
    border-radius: 8px; background: #1a1f2b;
  }
  .tile .tl { height: 9px; background: #232a3a; border-radius: 4px; margin-top: 8px; }
  .tile .tl.short { width: 55%; margin-top: 6px; }
  .dl-row { margin-top: 12px; display: none; }
  .dl-row button { padding: 9px 24px; }
  .dl-note { color: var(--muted); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1><span class="logo">🎬</span>智能封面图</h1>
    <span class="sub">粘贴 m3u8 链接 · 智能选帧 · 三张拼成一张封面</span>
  </div>

  <!-- 自由裁剪弹窗 -->
  <div id="crop-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;align-items:center;justify-content:center">
    <div class="card" style="max-width:760px;width:94%">
      <div class="section-title" style="margin-top:0">
        <h2>自由裁剪 <span style="color:var(--muted);font-size:12px;font-weight:400">在图上框选要保留的区域</span></h2>
      </div>
      <canvas id="crop-canvas" style="width:100%;border-radius:8px;cursor:crosshair;touch-action:none"></canvas>
      <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
        <button class="btn-ghost" id="crop-reset">重置为全图</button>
        <button class="btn-ghost" id="crop-cancel">取消</button>
        <button class="btn-primary" id="crop-ok" style="padding:8px 22px">应用</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="card">
      <div class="input-row">
        <input type="text" id="url" placeholder="https://example.com/video/index.m3u8" spellcheck="false"
               value="https://back_only.ffkm25.com/common/msdl//dd140d5457926a329f7198bf2__1183554/hls/1/index.m3u8">
        <button class="btn-primary" id="go" style="padding:11px 22px">生成封面</button>
      </div>
      <div class="status" id="status">智能选帧会自动避开黑屏和转场画面</div>
      <div class="section-title">
        <h2>候选帧 <span style="color:var(--muted);font-size:12px;font-weight:400">点击选帧，按布局用 1–4 张</span></h2>
        <button class="btn-ghost" id="reroll-all" disabled>🎲 全部换一批</button>
      </div>
      <div class="frames" id="frames"></div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">
        <h2>拼接结果 <span style="color:var(--muted);font-size:12px;font-weight:400">640×360 JPG</span></h2>
        <div class="dl-row" id="dl-row" style="margin:0">
          <button class="btn-primary" id="download-sm" style="padding:7px 16px;font-size:13px">⬇ 下载封面图</button>
          <button class="btn-primary" id="use-cover" disabled style="padding:7px 16px;font-size:13px;display:none;background:var(--accent2,#22c55e)">✓ 用作封面</button>
        </div>
      </div>
      <div id="layout" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">
        <div class="seg">
          <button data-l="h" class="active">横排</button>
          <button data-l="big">1大2小</button>
          <button data-l="bigr">2小1大</button>
          <button data-l="top1">上1下2</button>
          <button data-l="center">中间大</button>
          <button data-l="diag">斜切</button>
        </div>
        <div class="seg" style="align-self:flex-start">
          <button data-l="single">单图</button>
          <button data-l="h2">两联</button>
          <button data-l="diag2">斜切两联</button>
          <button data-l="grid4">四宫格</button>
          <button data-l="big3">1大3小</button>
        </div>
      </div>
      <div class="controls">
        <div class="seg" id="logo-toggle">
          <button data-lg="1" class="active">Logo</button>
          <button data-lg="0">无 Logo</button>
        </div>
        <div class="seg" id="sharpen-toggle" title="高清锐利化整张封面">
          <button data-sp="1" class="active">锐化</button>
          <button data-sp="0">原图</button>
        </div>
        <div class="seg" id="detext-toggle" title="自动打蒙画面中检测到的文字（水印/字幕/广告字）">
          <button data-dt="1" class="active">去文字</button>
          <button data-dt="0">保留文字</button>
        </div>
        <div class="seg" id="crop" title="按帧高比例裁掉每帧顶部，去除原视频水印">
          <button data-c="0">不裁顶</button>
          <button data-c="0.025">裁2.5%</button>
          <button data-c="0.05">裁5%</button>
          <button data-c="0.075" class="active">裁7.5%</button>
        </div>
        <div class="seg" id="mode" title="取景：拖动/滚轮调整画面；马赛克：在图上框选打码">
          <button data-m="pan" class="active">取景</button>
          <button data-m="mosaic">马赛克</button>
        </div>
        <div class="seg" id="mosaic-style" title="马赛克样式：打蒙=模糊更自然，颗粒=像素块">
          <button data-s="blur" class="active">打蒙</button>
          <button data-s="pixel">颗粒</button>
        </div>
        <button class="btn-ghost" id="mosaic-undo" style="padding:6px 10px;font-size:12px">撤销马赛克</button>
        <input type="text" id="title-input" placeholder="标题(可选)" maxlength="40"
          style="height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:inherit;padding:0 10px;font:inherit;min-width:150px">
        <div class="seg" id="title-pos" title="标题位置">
          <button data-tp="top">上</button>
          <button data-tp="mid">中</button>
          <button data-tp="bottom" class="active">下</button>
        </div>
        <div class="seg" id="title-style" title="标题样式：黑条=底部半透明条，描边=白字黑描边">
          <button data-ts="bar" class="active">黑条</button>
          <button data-ts="outline">描边</button>
        </div>
      </div>
      <div class="order-strip" id="order-strip"></div>
      <div id="result-box">
        <div id="result-empty">选满 3 张候选帧后自动拼接预览</div>
        <div class="pv-cap" id="cap-full" style="margin-top:0">整张预览 · 取景模式：拖动调整、滚轮缩放 · 马赛克模式：框选打码</div>
        <canvas id="result"></canvas>
        <div class="pv-cap" id="cap-phone">手机双列效果</div>
        <div class="phone" id="phone">
          <div class="tile"><img class="pv"><div class="tl"></div><div class="tl short"></div></div>
          <div class="tile"><img class="pv"><div class="tl"></div><div class="tl short"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const COUNT = 20;      // 候选帧数量
const CONCURRENCY = 6; // 同时截帧的并发数
// 每种布局需要的帧数
const LAYOUT_NEED = {
  h: 3, big: 3, bigr: 3, top1: 3, center: 3, diag: 3,
  single: 1, h2: 2, diag2: 2, grid4: 4, big3: 4,
};
const $ = (id) => document.getElementById(id);
const state = {
  url: '',
  duration: null,
  frames: new Array(COUNT).fill(null), // {time, img: HTMLImageElement}
  slots: [null, null, null],           // 卡槽：每格存候选帧下标，数量随布局变化
  offsets: [],                         // 每格取景偏移 {fx, fy, z}，拖动/滚轮调整
  crops: [],                           // 每格自由裁剪 {x,y,w,h}（0~1 比例，默认全图）
  sharpen: true,                       // 整图锐化（反锐化掩模）
  detext: true,                        // 自动打蒙画面里检测到的文字
  mode: 'pan',                         // 预览交互模式：pan 取景 / mosaic 马赛克
  mosaicStyle: 'blur',                 // 马赛克样式：blur 打蒙 / pixel 颗粒
  mosaics: [],                         // 马赛克区域 [{x,y,w,h}]，画布坐标
  activeSlot: null,                    // 当前高亮的目标卡槽
  layout: 'h',
  logo: true,
  title: '',                           // 封面标题文字（空=不显示）
  titlePos: 'bottom',                  // 标题位置：top / mid / bottom
  titleStyle: 'bar',                   // 标题样式：bar 半透明黑条 / outline 描边
  cropTop: 0.075, // 顶部裁剪，占帧高的比例
  running: false,
};

// 预载左上角 Logo 水印
const logoImg = new Image();
let logoReady = false;
logoImg.onload = () => { logoReady = true; stitch(); };
logoImg.src = '/logo.png';

function setStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = 'status ' + (cls || '');
}

const layoutNeed = () => LAYOUT_NEED[state.layout] || 3;

/** 卡槽数量跟随当前布局 */
function ensureSlots() {
  const n = layoutNeed();
  while (state.slots.length < n) state.slots.push(null);
  state.slots.length = n;
  while (state.offsets.length < n) state.offsets.push({ fx: 0.5, fy: 0.5, z: 1 });
  state.offsets.length = n;
  while (state.crops.length < n) state.crops.push({ x: 0, y: 0, w: 1, h: 1 });
  state.crops.length = n;
  if (state.activeSlot != null && state.activeSlot >= n) state.activeSlot = null;
}

const firstEmptySlot = () => {
  const k = state.slots.indexOf(null);
  return k < 0 ? null : k;
};

function renderFrameCards() {
  ensureSlots();
  const box = $('frames');
  box.innerHTML = '';
  for (let i = 0; i < COUNT; i++) {
    const f = state.frames[i];
    const order = state.slots.indexOf(i);
    const div = document.createElement('div');
    div.className =
      'frame' + (f === 'loading' ? ' loading' : '') + (order >= 0 ? ' sel' : '');
    if (f && f !== 'loading') {
      div.innerHTML = `
        ${order >= 0 ? `<div class="badge">${order + 1}</div>` : ''}
        <img src="${f.img.src}">
        <div class="bar">
          <span>${fmtTime(f.time)}</span>
          <button class="btn-ghost" onclick="event.stopPropagation();reroll(${i})">换一帧</button>
        </div>`;
      div.onclick = () => pickFrame(i);
    } else {
      div.innerHTML = `<div class="ph">${f === 'loading' ? '截取中' : '#' + (i + 1)}</div>`;
    }
    box.appendChild(div);
  }
  renderSlots();
}

/** 卡槽条：点卡槽指定目标位，点候选帧填入；可用 ←/→ 互换 */
function renderSlots() {
  const box = $('order-strip');
  box.innerHTML = '';
  state.slots.forEach((fi, pos) => {
    const f = fi != null ? state.frames[fi] : null;
    const filled = f && f !== 'loading';
    const d = document.createElement('div');
    d.className = 'oitem' + (state.activeSlot === pos ? ' active' : '') + (filled ? '' : ' empty');
    if (filled) {
      const c = state.crops[pos];
      const cropped = c && (c.x > 0 || c.y > 0 || c.w < 1 || c.h < 1);
      d.innerHTML = `
        <img src="${f.img.src}">
        <div class="cap">
          <button class="btn-ghost" ${pos === 0 ? 'disabled' : ''} onclick="event.stopPropagation();moveSel(${pos},-1)">←</button>
          <span>${pos + 1}号</span>
          <button class="btn-ghost" title="自由裁剪" ${cropped ? 'style="color:var(--accent);border-color:var(--accent)"' : ''} onclick="event.stopPropagation();openCrop(${pos})">✂</button>
          <button class="btn-ghost" ${pos === state.slots.length - 1 ? 'disabled' : ''} onclick="event.stopPropagation();moveSel(${pos},1)">→</button>
        </div>`;
    } else {
      d.innerHTML = `
        <div class="ph2">＋</div>
        <div class="cap"><span style="margin:0 auto">${pos + 1}号 · 待填入</span></div>`;
    }
    d.onclick = () => {
      state.activeSlot = state.activeSlot === pos ? null : pos;
      renderFrameCards();
    };
    box.appendChild(d);
  });
}

function moveSel(pos, dir) {
  const j = pos + dir;
  if (j < 0 || j >= state.slots.length) return;
  [state.slots[pos], state.slots[j]] = [state.slots[j], state.slots[pos]];
  [state.crops[pos], state.crops[j]] = [state.crops[j], state.crops[pos]]; // 裁剪跟着图走
  state.offsets[pos] = { fx: 0.5, fy: 0.5, z: 1 };
  state.offsets[j] = { fx: 0.5, fy: 0.5, z: 1 };
  renderFrameCards();
  stitch();
}
window.moveSel = moveSel;

/** 点候选帧：已在槽里则移除；否则填入高亮槽/第一个空槽，全满则替换最后一格 */
function pickFrame(i) {
  const f = state.frames[i];
  if (!f || f === 'loading') return;
  const cur = state.slots.indexOf(i);
  if (cur >= 0) {
    state.slots[cur] = null;
    state.offsets[cur] = { fx: 0.5, fy: 0.5, z: 1 };
    state.crops[cur] = { x: 0, y: 0, w: 1, h: 1 };
    state.activeSlot = cur;
  } else {
    let t = state.activeSlot != null ? state.activeSlot : firstEmptySlot();
    if (t == null) t = state.slots.length - 1;
    state.slots[t] = i;
    state.offsets[t] = { fx: 0.5, fy: 0.5, z: 1 };
    state.crops[t] = { x: 0, y: 0, w: 1, h: 1 };
    state.activeSlot = firstEmptySlot();
  }
  renderFrameCards();
  stitch();
}
window.pickFrame = pickFrame;

function fmtTime(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

async function api(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || '请求失败');
  return data;
}

function loadImg(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

async function fetchFrame(i) {
  state.frames[i] = 'loading';
  renderFrameCards();
  const data = await api('/api/frame', {
    url: state.url, duration: state.duration, index: i, count: COUNT,
  });
  const img = await loadImg(data.image);
  state.frames[i] = { time: data.time, img, textBoxes: data.textBoxes || [] };
  renderFrameCards();
  stitch();
}

/** 限并发地截取全部候选帧，返回失败数 */
async function fetchAll() {
  let next = 0, done = 0, failed = 0;
  const worker = async () => {
    while (next < COUNT) {
      const i = next++;
      try {
        await fetchFrame(i);
      } catch {
        state.frames[i] = null;
        failed++;
        renderFrameCards();
      }
      done++;
      setStatus(`智能选帧中… ${done}/${COUNT}`, 'busy');
    }
  };
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  return failed;
}

async function generate() {
  const url = $('url').value.trim();
  if (!url) { setStatus('请先输入 m3u8 链接', 'err'); return; }
  state.url = url;
  state.running = true;
  state.frames = new Array(COUNT).fill(null);
  state.slots = Array.from({ length: layoutNeed() }, (_, k) => k); // 默认按顺序填前几张
  state.offsets = state.slots.map(() => ({ fx: 0.5, fy: 0.5, z: 1 }));
  state.crops = state.slots.map(() => ({ x: 0, y: 0, w: 1, h: 1 }));
  state.mosaics = [];
  state.activeSlot = null;
  renderFrameCards();
  $('go').disabled = true;
  $('reroll-all').disabled = true;

  try {
    setStatus('正在解析视频信息…', 'busy');
    const probe = await api('/api/probe', { url });
    state.duration = probe.duration;
    const failed = await fetchAll();
    if (failed === COUNT) throw new Error('全部截帧失败，请检查链接');
    setStatus(
      failed ? `完成，但有 ${failed} 帧失败，可单独重试` : '✓ 已截取 ' + COUNT + ' 张候选帧',
      failed ? 'err' : 'ok'
    );
  } catch (e) {
    setStatus('✕ ' + e.message, 'err');
    renderFrameCards();
  } finally {
    state.running = false;
    $('go').disabled = false;
    $('reroll-all').disabled = false;
  }
}

async function reroll(i) {
  if (state.running || !state.url) return;
  try {
    await fetchFrame(i);
  } catch (e) {
    state.frames[i] = null;
    renderFrameCards();
    setStatus('✕ 第 ' + (i + 1) + ' 帧截取失败：' + e.message, 'err');
  }
}
window.reroll = reroll;

$('reroll-all').onclick = async () => {
  if (state.running || !state.url) return;
  state.running = true;
  $('go').disabled = true;
  $('reroll-all').disabled = true;
  try {
    const failed = await fetchAll();
    setStatus(failed ? `完成，但有 ${failed} 帧失败` : '✓ 已更换全部候选帧', failed ? 'err' : 'ok');
  } finally {
    state.running = false;
    $('go').disabled = false;
    $('reroll-all').disabled = false;
  }
};

// ---------- Canvas 拼接（固定输出 1280×720 高清） ----------
const OUT_W = 1280, OUT_H = 720;

function stitch(light) {
  ensureSlots();
  const picked = state.slots.map((fi) => (fi != null ? state.frames[fi] : null));
  const missing = picked.filter((f) => !f || f === 'loading').length;
  if (missing > 0) {
    if (state.frames.some((f) => f && f !== 'loading')) {
      setStatus(`还差 ${missing} 张：点击候选帧填入空位`, 'busy');
    }
    return;
  }
  const [a, b, c, d] = picked.map((f) => f.img);
  const canvas = $('result');
  const ctx = canvas.getContext('2d');
  canvas.width = OUT_W;
  canvas.height = OUT_H;
  paintBg(ctx, canvas);
  const W = OUT_W, H = OUT_H;

  const cells = layoutCells(W, H);
  lastCells = cells;
  cells.forEach((cell, i) => {
    const img = picked[i].img;
    const off = state.offsets[i] || { fx: 0.5, fy: 0.5, z: 1 };
    const crop = state.crops[i];
    if (cell.poly) {
      ctx.save();
      ctx.beginPath();
      cell.poly.forEach(([x, y], j) => (j ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.closePath();
      ctx.clip();
      drawCover(ctx, img, cell.x, cell.y, cell.w, cell.h, off, crop);
      ctx.restore();
    } else {
      drawCover(ctx, img, cell.x, cell.y, cell.w, cell.h, off, crop);
    }
  });

  if (state.sharpen && !light) sharpenCanvas(ctx, canvas, 3, 0.9); // 锐化在打码和 logo 之前

  if (state.detext && !light) applyTextBlur(ctx, canvas, cells, picked); // 自动打蒙文字

  applyMosaics(ctx, canvas);

  // 左上角盖 Logo：不加底板，用多层黑色投影把 logo 从画面里衬出来
  if (state.logo && logoReady) {
    const lw = 400;
    const lh = Math.round(lw * logoImg.naturalHeight / logoImg.naturalWidth);
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
    ctx.shadowBlur = 18;
    ctx.drawImage(logoImg, 24, 24, lw, lh); // 画两遍加深阴影轮廓
    ctx.drawImage(logoImg, 24, 24, lw, lh);
    ctx.restore();
  }

  drawTitle(ctx, canvas); // 标题文字（空则跳过）

  if (light) return; // 拖动过程中只重绘画布，跳过下面的重活

  // 手机双列预览在 updateDownloads 里用 640 成品图更新（所见即所得）
  $('result-empty').style.display = 'none';
  canvas.style.display = 'block';
  $('cap-full').style.display = 'block';
  $('cap-phone').style.display = 'block';
  $('phone').style.display = 'grid';
  $('dl-row').style.display = 'block';
  updateDownloads();
}

function paintBg(ctx, canvas) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

/** 封面标题：canvas 叠字，导出时随整图缩到 640。超长自动缩字号保证一行放下。 */
function drawTitle(ctx, canvas) {
  const text = (state.title || '').trim();
  if (!text) return;
  const W = canvas.width, H = canvas.height;
  const maxW = W * 0.92;
  const fontOf = (s) => `700 ${s}px -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif`;
  let size = Math.round(H * 0.13);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = fontOf(size);
  while (ctx.measureText(text).width > maxW && size > 14) { size -= 2; ctx.font = fontOf(size); }
  const cx = W / 2;
  const margin = H * 0.03;
  let cy;
  if (state.titlePos === 'top') cy = size * 0.72 + margin;
  else if (state.titlePos === 'mid') cy = H / 2;
  else cy = H - size * 0.72 - margin;
  if (state.titleStyle === 'bar') {
    const barH = size * 1.7;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, Math.round(cy - barH / 2), W, Math.round(barH));
    ctx.fillStyle = '#fff';
    ctx.fillText(text, cx, cy);
  } else {
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = size * 0.28;
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(3, size * 0.14);
    ctx.strokeStyle = 'rgba(0,0,0,0.92)';
    ctx.strokeText(text, cx, cy);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.fillText(text, cx, cy);
  }
  ctx.restore();
}

/**
 * 高清锐利化：反锐化掩模 sharpened = orig + amount × (orig − blur(radius))。
 * radius 要按画布分辨率选：1280 画布用 3px（缩小显示后仍可见），640 导出用 1px。
 */
function sharpenCanvas(ctx, canvas, radius = 3, amount = 0.7) {
  const w = canvas.width, h = canvas.height;
  mosaicTmp.width = w; mosaicTmp.height = h;
  const t = mosaicTmp.getContext('2d');
  t.filter = `blur(${radius}px)`;
  t.drawImage(canvas, 0, 0);
  t.filter = 'none';
  const orig = ctx.getImageData(0, 0, w, h);
  const blur = t.getImageData(0, 0, w, h);
  const o = orig.data, b = blur.data;
  for (let i = 0; i < o.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      const v = o[i + c] + amount * (o[i + c] - b[i + c]);
      o[i + c] = v < 0 ? 0 : v > 255 ? 255 : v;
    }
  }
  ctx.putImageData(orig, 0, 0);
}

/** 自动打蒙：把每格取景窗内检测到的文字框映射到画布坐标后模糊掉 */
function applyTextBlur(ctx, canvas, cells, picked) {
  cells.forEach((cell, i) => {
    const f = picked[i];
    if (!f || !f.textBoxes || !f.textBoxes.length) return;
    const img = f.img;
    const off = state.offsets[i] || { fx: 0.5, fy: 0.5, z: 1 };
    const w = coverWindow(img, cell.w, cell.h, off, state.crops[i]);
    const W0 = img.naturalWidth, H0 = img.naturalHeight;
    f.textBoxes.forEach((b) => {
      // 文字框（源图像素）与取景窗求交
      const x0 = Math.max(b.x * W0, w.sx), y0 = Math.max(b.y * H0, w.sy);
      const x1 = Math.min((b.x + b.w) * W0, w.sx + w.sw);
      const y1 = Math.min((b.y + b.h) * H0, w.sy + w.sh);
      if (x1 - x0 < 4 || y1 - y0 < 4) return;
      // 映射到画布坐标并按文字高度外扩，保证盖住描边
      const scaleX = cell.w / w.sw, scaleY = cell.h / w.sh;
      const pad = (y1 - y0) * 0.4;
      let cx = cell.x + (x0 - w.sx - pad) * scaleX;
      let cy = cell.y + (y0 - w.sy - pad) * scaleY;
      let cw2 = (x1 - x0 + pad * 2) * scaleX;
      let ch2 = (y1 - y0 + pad * 2) * scaleY;
      // 钳制在画布内
      if (cx < 0) { cw2 += cx; cx = 0; }
      if (cy < 0) { ch2 += cy; cy = 0; }
      cw2 = Math.min(canvas.width - cx, cw2);
      ch2 = Math.min(canvas.height - cy, ch2);
      if (cw2 < 4 || ch2 < 4) return;
      blurPatch(ctx, canvas, Math.round(cx), Math.round(cy), Math.round(cw2), Math.round(ch2));
    });
  });
}

// ---------- 马赛克 ----------
const mosaicTmp = document.createElement('canvas');

function applyMosaics(ctx, canvas) {
  state.mosaics.forEach((r) => {
    const x = Math.max(0, Math.round(r.x)), y = Math.max(0, Math.round(r.y));
    const w = Math.min(canvas.width - x, Math.round(r.w));
    const h = Math.min(canvas.height - y, Math.round(r.h));
    if (w < 4 || h < 4) return;
    if ((r.style || 'blur') === 'pixel') pixelate(ctx, canvas, x, y, w, h);
    else blurPatch(ctx, canvas, x, y, w, h);
  });
}

/** 颗粒：经典像素块化 */
function pixelate(ctx, canvas, x, y, w, h) {
  const BLOCK = 18;
  const bw = Math.max(1, Math.round(w / BLOCK));
  const bh = Math.max(1, Math.round(h / BLOCK));
  mosaicTmp.width = bw; mosaicTmp.height = bh;
  const t = mosaicTmp.getContext('2d');
  t.imageSmoothingEnabled = true;
  t.drawImage(canvas, x, y, w, h, 0, 0, bw, bh);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mosaicTmp, 0, 0, bw, bh, x, y, w, h);
  ctx.imageSmoothingEnabled = true;
}

/** 打蒙：重高斯模糊 + 羽化边缘，观感比色块自然 */
function blurPatch(ctx, canvas, x, y, w, h) {
  const blur = Math.max(18, Math.min(40, Math.min(w, h) / 5));
  // 羽化半径按区域大小成比例（固定 14px 在 1280 大画布上看不出），下限保证小框也可见。
  const feather = Math.max(10, Math.min(48, Math.min(w, h) * 0.18));
  const pad = Math.round(blur * 2 + feather * 2);
  const x0 = Math.max(0, x - pad), y0 = Math.max(0, y - pad);
  const x1 = Math.min(canvas.width, x + w + pad), y1 = Math.min(canvas.height, y + h + pad);
  const pw = x1 - x0, ph = y1 - y0;
  mosaicTmp.width = pw; mosaicTmp.height = ph;
  const t = mosaicTmp.getContext('2d');
  t.filter = `blur(${blur}px)`;
  t.drawImage(canvas, x0, y0, pw, ph, 0, 0, pw, ph);
  t.filter = 'none';
  // 羽化：遮罩盖满【整个框】(不内缩)，模糊向【外】扩 → 框内全覆盖、框外软过渡，边缘不再漏。
  t.globalCompositeOperation = 'destination-in';
  t.filter = `blur(${feather}px)`;
  t.fillStyle = '#fff';
  t.fillRect(x - x0 - feather, y - y0 - feather, w + feather * 2, h + feather * 2);
  t.filter = 'none';
  t.globalCompositeOperation = 'source-over';
  ctx.drawImage(mosaicTmp, 0, 0, pw, ph, x0, y0, pw, ph);
}

/** 当前布局的单元格列表，下标与卡槽一一对应；斜切布局带裁剪多边形 */
function layoutCells(W, H) {
  const L = state.layout;
  if (L === 'h') {
    const cw = Math.round(W / 3);
    return [
      { x: 0, y: 0, w: cw, h: H },
      { x: cw, y: 0, w: cw, h: H },
      { x: cw * 2, y: 0, w: W - cw * 2, h: H },
    ];
  }
  if (L === 'big') {
    const bigW = Math.round(W * 2 / 3), sw = W - bigW, sh = H / 2;
    return [
      { x: 0, y: 0, w: bigW, h: H },
      { x: bigW, y: 0, w: sw, h: sh },
      { x: bigW, y: sh, w: sw, h: sh },
    ];
  }
  if (L === 'bigr') {
    const bigW = Math.round(W * 2 / 3), sw = W - bigW, sh = H / 2;
    return [
      { x: sw, y: 0, w: bigW, h: H },
      { x: 0, y: 0, w: sw, h: sh },
      { x: 0, y: sh, w: sw, h: sh },
    ];
  }
  if (L === 'top1') {
    const th = Math.round(H / 2);
    return [
      { x: 0, y: 0, w: W, h: th },
      { x: 0, y: th, w: W / 2, h: H - th },
      { x: W / 2, y: th, w: W / 2, h: H - th },
    ];
  }
  if (L === 'center') {
    const side = Math.round(W / 4), mid = W - side * 2;
    return [
      { x: 0, y: 0, w: side, h: H },
      { x: side, y: 0, w: mid, h: H },
      { x: side + mid, y: 0, w: side, h: H },
    ];
  }
  if (L === 'single') return [{ x: 0, y: 0, w: W, h: H }];
  if (L === 'h2') {
    const cw = Math.round(W / 2);
    return [
      { x: 0, y: 0, w: cw, h: H },
      { x: cw, y: 0, w: W - cw, h: H },
    ];
  }
  if (L === 'grid4') {
    const cw = Math.round(W / 2), ch = Math.round(H / 2);
    return [
      { x: 0, y: 0, w: cw, h: ch },
      { x: cw, y: 0, w: W - cw, h: ch },
      { x: 0, y: ch, w: cw, h: H - ch },
      { x: cw, y: ch, w: W - cw, h: H - ch },
    ];
  }
  if (L === 'big3') {
    const bigW = Math.round(W * 2 / 3), sw = W - bigW, sh = H / 3;
    return [
      { x: 0, y: 0, w: bigW, h: H },
      { x: bigW, y: 0, w: sw, h: sh },
      { x: bigW, y: sh, w: sw, h: sh },
      { x: bigW, y: sh * 2, w: sw, h: sh },
    ];
  }
  // 斜切系列：平行斜线分割
  const polys =
    L === 'diag2'
      ? (() => {
          const s = 64, m = W / 2;
          return [
            [[0, 0], [m + s, 0], [m - s, H], [0, H]],
            [[m + s, 0], [W, 0], [W, H], [m - s, H]],
          ];
        })()
      : (() => {
          const s = 56, b1 = W / 3, b2 = (W / 3) * 2;
          return [
            [[0, 0], [b1 + s, 0], [b1 - s, H], [0, H]],
            [[b1 + s, 0], [b2 + s, 0], [b2 - s, H], [b1 - s, H]],
            [[b2 + s, 0], [W, 0], [W, H], [b2 - s, H]],
          ];
        })();
  return polys.map((poly) => {
    const xs = poly.map((p) => p[0]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    return { x: minX, y: 0, w: maxX - minX, h: H, poly };
  });
}

/**
 * 等比缩放裁剪填满目标区域（object-fit: cover）。
 * 先按比例掐掉源图顶部（去原视频水印），再在剩余区域内取景；
 * off.fx / off.fy（0~1，0.5 居中）控制取景窗位置，可拖动调整；
 * off.z（≥1，默认 1）为缩放倍数，越大取景窗越小 = 画面越放大。
 */
function coverWindow(img, dw, dh, off, crop) {
  const W0 = img.naturalWidth, H0 = img.naturalHeight;
  const c = crop || { x: 0, y: 0, w: 1, h: 1 };
  const left = c.x * W0;
  const availW = Math.max(16, c.w * W0);
  // 顶部：全局裁顶和自由裁剪取更深的那个
  const top = Math.max(Math.min(state.cropTop, 0.2) * H0, c.y * H0);
  const availH = Math.max(16, (c.y + c.h) * H0 - top);
  const dRatio = dw / dh;
  let sw = availW, sh = availH;
  if (availW / availH > dRatio) sw = sh * dRatio;
  else sh = sw / dRatio;
  const z = Math.max(1, off.z || 1);
  sw /= z; sh /= z;
  return {
    sw, sh,
    sx: left + (availW - sw) * off.fx,
    sy: top + (availH - sh) * off.fy,
    slackX: availW - sw,
    slackY: availH - sh,
  };
}

function drawCover(ctx, img, x, y, dw, dh, off = { fx: 0.5, fy: 0.5, z: 1 }, crop) {
  const w = coverWindow(img, dw, dh, off, crop);
  ctx.drawImage(img, w.sx, w.sy, w.sw, w.sh, x, y, dw, dh);
}

// ---------- 拖动调整取景 ----------
let lastCells = [];
let drag = null;
const clamp01 = (v) => Math.min(1, Math.max(0, v));

function pointInPoly(p, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (yi > p.y !== yj > p.y && p.x < ((xj - xi) * (p.y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function cellIndexAt(p) {
  for (let i = 0; i < lastCells.length; i++) {
    const c = lastCells[i];
    const hit = c.poly
      ? pointInPoly(p, c.poly)
      : p.x >= c.x && p.x < c.x + c.w && p.y >= c.y && p.y < c.y + c.h;
    if (hit) return i;
  }
  return -1;
}

const resultCanvas = $('result');

function canvasPoint(e) {
  const rect = resultCanvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (resultCanvas.width / rect.width),
    y: (e.clientY - rect.top) * (resultCanvas.height / rect.height),
  };
}

let mosaicDraft = null; // 正在框选的马赛克区域

resultCanvas.addEventListener('pointerdown', (e) => {
  if (state.mode === 'mosaic') {
    const p = canvasPoint(e);
    mosaicDraft = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    resultCanvas.setPointerCapture(e.pointerId);
    e.preventDefault();
    return;
  }
  const i = cellIndexAt(canvasPoint(e));
  if (i < 0) return;
  const f = state.slots[i] != null ? state.frames[state.slots[i]] : null;
  if (!f || f === 'loading') return;
  const off = state.offsets[i] || (state.offsets[i] = { fx: 0.5, fy: 0.5, z: 1 });
  drag = { i, x0: e.clientX, y0: e.clientY, fx0: off.fx, fy0: off.fy };
  resultCanvas.setPointerCapture(e.pointerId);
  resultCanvas.style.cursor = 'grabbing';
  e.preventDefault();
});

const draftRect = () => ({
  x: Math.min(mosaicDraft.x0, mosaicDraft.x1),
  y: Math.min(mosaicDraft.y0, mosaicDraft.y1),
  w: Math.abs(mosaicDraft.x1 - mosaicDraft.x0),
  h: Math.abs(mosaicDraft.y1 - mosaicDraft.y0),
});

resultCanvas.addEventListener('pointermove', (e) => {
  if (mosaicDraft) {
    const p = canvasPoint(e);
    mosaicDraft.x1 = p.x;
    mosaicDraft.y1 = p.y;
    stitch(true);
    // 画框选虚线
    const ctx = resultCanvas.getContext('2d');
    const r = draftRect();
    ctx.save();
    ctx.strokeStyle = '#5b8cff';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 6]);
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.restore();
    return;
  }
  if (!drag) return;
  const cell = lastCells[drag.i];
  const img = state.frames[state.slots[drag.i]].img;
  const off = state.offsets[drag.i];
  const w = coverWindow(img, cell.w, cell.h, off, state.crops[drag.i]);
  // 屏幕位移 → 画布位移 → 源图位移 → 取景窗位置增量（拖动方向与取景窗移动方向相反）
  const rect = resultCanvas.getBoundingClientRect();
  const cssToCanvas = resultCanvas.width / rect.width;
  const canvasToSrc = w.sw / cell.w;
  const dxSrc = (e.clientX - drag.x0) * cssToCanvas * canvasToSrc;
  const dySrc = (e.clientY - drag.y0) * cssToCanvas * canvasToSrc;
  if (w.slackX > 1) off.fx = clamp01(drag.fx0 - dxSrc / w.slackX);
  if (w.slackY > 1) off.fy = clamp01(drag.fy0 - dySrc / w.slackY);
  stitch(true);
});

const endDrag = () => {
  if (mosaicDraft) {
    const r = draftRect();
    if (r.w > 12 && r.h > 12) state.mosaics.push({ ...r, style: state.mosaicStyle }); // 过小的框视为误触
    mosaicDraft = null;
    stitch();
    return;
  }
  if (!drag) return;
  drag = null;
  resultCanvas.style.cursor = 'grab';
  stitch(); // 松手后完整更新手机预览和下载体积
};
resultCanvas.addEventListener('pointerup', endDrag);
resultCanvas.addEventListener('pointercancel', endDrag);

// ---------- 自由裁剪弹窗 ----------
let cropEdit = null; // {pos, img, rect(0~1 比例), start}
const cropCv = $('crop-canvas');

function openCrop(pos) {
  const fi = state.slots[pos];
  const f = fi != null ? state.frames[fi] : null;
  if (!f || f === 'loading') return;
  cropEdit = { pos, img: f.img, rect: { ...state.crops[pos] }, start: null };
  cropCv.width = f.img.naturalWidth;
  cropCv.height = f.img.naturalHeight;
  $('crop-modal').style.display = 'flex';
  drawCropEditor();
}
window.openCrop = openCrop;

function drawCropEditor() {
  const cx = cropCv.getContext('2d');
  cx.drawImage(cropEdit.img, 0, 0);
  const r = cropEdit.rect;
  const X = r.x * cropCv.width, Y = r.y * cropCv.height;
  const Wc = r.w * cropCv.width, Hc = r.h * cropCv.height;
  cx.save();
  cx.fillStyle = 'rgba(0,0,0,.55)'; // 压暗保留区以外的部分
  cx.fillRect(0, 0, cropCv.width, Y);
  cx.fillRect(0, Y + Hc, cropCv.width, cropCv.height - Y - Hc);
  cx.fillRect(0, Y, X, Hc);
  cx.fillRect(X + Wc, Y, cropCv.width - X - Wc, Hc);
  cx.strokeStyle = '#5b8cff';
  cx.lineWidth = Math.max(2, cropCv.width / 320);
  cx.setLineDash([14, 8]);
  cx.strokeRect(X, Y, Wc, Hc);
  cx.restore();
}

function cropPoint(e) {
  const rect = cropCv.getBoundingClientRect();
  return {
    x: Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)),
    y: Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height)),
  };
}

cropCv.addEventListener('pointerdown', (e) => {
  if (!cropEdit) return;
  cropEdit.start = cropPoint(e);
  cropCv.setPointerCapture(e.pointerId);
  e.preventDefault();
});
cropCv.addEventListener('pointermove', (e) => {
  if (!cropEdit || !cropEdit.start) return;
  const p = cropPoint(e), s = cropEdit.start;
  cropEdit.rect = {
    x: Math.min(s.x, p.x),
    y: Math.min(s.y, p.y),
    w: Math.abs(p.x - s.x),
    h: Math.abs(p.y - s.y),
  };
  drawCropEditor();
});
const endCropDrag = () => {
  if (!cropEdit || !cropEdit.start) return;
  cropEdit.start = null;
  // 框太小视为误触，恢复全图
  if (cropEdit.rect.w < 0.05 || cropEdit.rect.h < 0.05) {
    cropEdit.rect = { x: 0, y: 0, w: 1, h: 1 };
    drawCropEditor();
  }
};
cropCv.addEventListener('pointerup', endCropDrag);
cropCv.addEventListener('pointercancel', endCropDrag);

$('crop-reset').onclick = () => {
  if (!cropEdit) return;
  cropEdit.rect = { x: 0, y: 0, w: 1, h: 1 };
  drawCropEditor();
};
$('crop-cancel').onclick = () => {
  cropEdit = null;
  $('crop-modal').style.display = 'none';
};
$('crop-ok').onclick = () => {
  if (!cropEdit) return;
  state.crops[cropEdit.pos] = { ...cropEdit.rect };
  state.offsets[cropEdit.pos] = { fx: 0.5, fy: 0.5, z: 1 }; // 裁剪变了，取景回到居中
  cropEdit = null;
  $('crop-modal').style.display = 'none';
  renderFrameCards();
  stitch();
};

// 模式切换：取景 / 马赛克
$('mode').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.mode = btn.dataset.m;
  [...$('mode').children].forEach((b) => b.classList.toggle('active', b === btn));
  resultCanvas.style.cursor = state.mode === 'mosaic' ? 'crosshair' : 'grab';
};

$('sharpen-toggle').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.sharpen = btn.dataset.sp === '1';
  [...$('sharpen-toggle').children].forEach((b) => b.classList.toggle('active', b === btn));
  stitch();
};

$('detext-toggle').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.detext = btn.dataset.dt === '1';
  [...$('detext-toggle').children].forEach((b) => b.classList.toggle('active', b === btn));
  stitch();
};

$('mosaic-style').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.mosaicStyle = btn.dataset.s;
  [...$('mosaic-style').children].forEach((b) => b.classList.toggle('active', b === btn));
};

$('mosaic-undo').onclick = () => {
  if (!state.mosaics.length) return;
  state.mosaics.pop();
  stitch();
};

// 滚轮缩放：悬停在哪一格就缩放哪一格（放大 = 裁得更紧）
let wheelTimer = null;
resultCanvas.addEventListener('wheel', (e) => {
  if (state.mode === 'mosaic') return;
  const i = cellIndexAt(canvasPoint(e));
  if (i < 0) return;
  const f = state.slots[i] != null ? state.frames[state.slots[i]] : null;
  if (!f || f === 'loading') return;
  e.preventDefault();
  const off = state.offsets[i] || (state.offsets[i] = { fx: 0.5, fy: 0.5, z: 1 });
  off.z = Math.min(4, Math.max(1, (off.z || 1) * (e.deltaY < 0 ? 1.08 : 1 / 1.08)));
  stitch(true);
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => stitch(), 250); // 停止滚动后完整更新
}, { passive: false });

$('layout').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.layout = btn.dataset.l;
  $('layout').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
  renderFrameCards(); // 卡槽数量随布局变化
  stitch();
};
$('logo-toggle').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.logo = btn.dataset.lg === '1';
  [...$('logo-toggle').children].forEach((b) => b.classList.toggle('active', b === btn));
  stitch();
};
$('title-input').oninput = (e) => { state.title = e.target.value; stitch(); };
$('title-pos').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.titlePos = btn.dataset.tp;
  [...$('title-pos').children].forEach((b) => b.classList.toggle('active', b === btn));
  stitch();
};
$('title-style').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.titleStyle = btn.dataset.ts;
  [...$('title-style').children].forEach((b) => b.classList.toggle('active', b === btn));
  stitch();
};
$('crop').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.cropTop = Number(btn.dataset.c);
  [...$('crop').children].forEach((b) => b.classList.toggle('active', b === btn));
  stitch();
};

// ---------- 导出：640×360 JPG 压缩（在 1280 画布上合成后超采样缩小） ----------
let smallBlob = null, exportSeq = 0;

const toBlobAsync = (cv, type, q) => new Promise((r) => cv.toBlob(r, type, q));
const kb = (n) => (n / 1024).toFixed(0) + 'KB';

async function updateDownloads() {
  const seq = ++exportSeq;
  const small = document.createElement('canvas');
  small.width = 640; small.height = 360;
  const sctx = small.getContext('2d');
  sctx.drawImage($('result'), 0, 0, 640, 360);
  if (state.sharpen) sharpenCanvas(sctx, small, 1, 0.8); // 在 640 输出分辨率上做主力锐化
  const sm = await toBlobAsync(small, 'image/jpeg', 0.8);
  // 手机双列预览直接用 640 成品图（所见即所得）
  const smallUrl = small.toDataURL('image/jpeg', 0.9);
  document.querySelectorAll('.pv').forEach((img) => (img.src = smallUrl));
  if (seq !== exportSeq) return; // 期间又重新拼接了，丢弃本次结果
  smallBlob = sm;
  $('download-sm').textContent = `⬇ 下载封面图 · ${kb(sm.size)}`;
  const uc = $('use-cover');
  if (uc && uc.style.display !== 'none') { uc.disabled = false; uc.textContent = '✓ 用作封面'; }
}

$('download-sm').onclick = () => {
  if (!smallBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(smallBlob);
  a.download = `cover-640x360-${Date.now()}.jpg`;
  a.click();
  URL.revokeObjectURL(a.href);
};

$('go').onclick = generate;
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });

renderFrameCards();

// ---------- 后台「手动选封面」对接 ----------
// URL 参数：?m3u8=&external_id=&sign=&callback=（callback 已含 ?sign=，回写时原样 POST）。
const PICK = new URLSearchParams(location.search);
const PICK_EXTERNAL = PICK.get('external_id');
const PICK_CALLBACK = PICK.get('callback');

const blobToDataUrl = (b) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = rej;
  r.readAsDataURL(b);
});

$('use-cover').onclick = async () => {
  if (!PICK_EXTERNAL || !PICK_CALLBACK) return alert('缺少回调参数，无法回写');
  if (!smallBlob) return alert('请先生成封面');
  const btn = $('use-cover');
  btn.disabled = true; btn.textContent = '上传中…';
  try {
    const image = await blobToDataUrl(smallBlob);
    const r = await fetch('/api/publish', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image, external_id: PICK_EXTERNAL, callback: PICK_CALLBACK }),
    });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || j.detail || '上传失败');
    btn.textContent = '✓ 已更新封面';
    alert('封面已更新，可关闭本页返回后台');
  } catch (e) {
    btn.disabled = false; btn.textContent = '✓ 用作封面';
    alert(e.message);
  }
};

// 从后台跳来：自动填 m3u8、亮出「用作封面」、自动生成。
(function initFromQuery() {
  const m3u8 = PICK.get('m3u8');
  if (m3u8) $('url').value = m3u8;
  if (PICK_EXTERNAL && PICK_CALLBACK) {
    const b = $('use-cover');
    b.style.display = '';
    if (m3u8 && typeof generate === 'function') generate();
  }
})();
</script>
